# Shell in this repository. Contract and schema:
# https://github.com/melodic-software/claude-code-plugins/tree/main/docs/contracts/ecosystem-commands
# shellcheck reads the root .shellcheckrc, as CI's check-shell job and the
# lefthook-shellcheck lane run it. Commands run from the repository root: the
# test suites name their sourced helpers relative to it.
globs: ["*.sh", "*.bash"]
build-cmd: null
test-cmd: null
check-cmd: 'shellcheck --rcfile "$REPO_ROOT/.shellcheckrc" <files>'
fix-cmd: "shfmt -w <files>"
opt-in: "shellcheck always applies to shell files"
install-hint: "winget install ShellCheck.ShellCheck mvdan.shfmt | brew install shellcheck shfmt"
tool-pin:
  shellcheck: "0.11.0"
notes: "test-cmd is null: CI runs each component's *.test.sh contract suite by name through harness/shell/run-tests.sh, which treats every argument as a test file, so a changed-files command would run non-test scripts as tests. Extensionless shebang scripts (components/cloud-environment/vault-exec and its siblings) match no glob; CI's shellcheck action lints them."
