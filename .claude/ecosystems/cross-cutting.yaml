# Repository-wide text checks in this repository. Contract and schema:
# https://github.com/melodic-software/claude-code-plugins/tree/main/docs/contracts/ecosystem-commands
# Lint-only: /toolchain:lint runs it, /toolchain:check does not. Each tool reads
# its root config; the intentionally bad fixtures are excluded the way CI's
# check-repo-hygiene and check-markdown-and-links jobs exclude them. Every check
# runs and any failure fails the command. Commands run from the repository root.
globs: ["**"]
build-cmd: null
test-cmd: null
check-cmd: |
  rc=0
  typos --exclude 'components/*/fixtures/bad/' || rc=1
  gitleaks dir . --config .gitleaks.toml --no-banner --redact || rc=1
  # editorconfig-checker: binary name varies by install method (ec / editorconfig-checker / ec-windows-amd64)
  if [ -n "$EC_BIN" ]; then "$EC_BIN" -exclude 'components/[^/]+/fixtures/bad/' || rc=1; else echo 'editorconfig-checker: no binary resolved (EC_BIN is empty)' >&2; rc=1; fi
  # lychee-offline: on-disk link and anchor integrity, no network
  lychee --offline --no-progress --exclude-path 'components/[^/]+/fixtures/bad' './**/*.md' || rc=1
  test "$rc" -eq 0
fix-cmd: null
opt-in: "each tool's own config at the repository root (_typos.toml, .gitleaks.toml, .editorconfig-checker.json, lychee.toml)"
install-hint: |
  typos, at the version ci-workflows' typos action pins: winget install Crate-CI.Typos | brew install typos-cli
  gitleaks, at the version ci-workflows' gitleaks action pins: winget install Gitleaks.Gitleaks | brew install gitleaks
  editorconfig-checker, at the version ci-workflows' editorconfig-checker action pins: winget install EditorConfig-Checker.EditorConfig-Checker | brew install editorconfig-checker
  lychee 0.24.2: winget install lycheeverse.lychee | brew install lychee
tool-pin:
  lychee: "0.24.2"
notes: "Lint-only: owned by /toolchain:lint. typos, gitleaks and editorconfig-checker run at the version input defaults of the ci-workflows composites CI's check-repo-hygiene job calls at the commit pr-require-checks.yml pins (typos/action.yml, gitleaks/action.yml, editorconfig-checker/action.yml); the lychee pin is the job's inline install (pr-require-checks.yml). gitleaks runs as the composite does with CI's inputs: scan-mode dir, path '.', config .gitleaks.toml, then --no-banner --redact (gitleaks/action.yml defaults, gitleaks/scan.sh args). gitleaks dir scans every file on disk under the repository root, tracked, untracked or git-ignored, and not git history."
