version: 2
updates:
  # Keep SHA-pinned actions current — including the cross-repo ci-workflows
  # composite actions referenced from .github/workflows/pr-require-checks.yml. Merge lanes per
  # components/dependabot-policy: the vendor-actions group (non-major only) may
  # auto-merge once ci-status passes; every other PR is reviewed by hand. Bumping
  # the pin to the private ci-workflows repo requires the org-level "Grant
  # Dependabot access to private repositories" setting to include ci-workflows.
  # Delay version bumps so a compromised or yanked release is caught before we
  # adopt it; security updates bypass cooldown. Defense-in-depth for the
  # SHA-rewrite supply-chain risk that motivates SHA-pinning.
  - package-ecosystem: github-actions
    directory: /
    labels: ["dependencies"]
    open-pull-requests-limit: 5
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    # Vendor bumps get their own PR so a community bump never blocks the
    # auto-merge lane; a dependency joins the first group that matches it.
    groups:
      vendor-actions:
        patterns:
          - "actions/*"
          - "github/*"
          - "anthropics/*"
        # Majors fall through to the reviewed group below.
        update-types: ["minor", "patch"]
      github-actions:
        patterns:
          - "*"
    # Every fleet consumer ignores ci-workflows pins (see the header of
    # maintenance-repin-ci-workflows.yml, which re-pins the caller components
    # on each release); this repository's own pins move by hand.
    ignore:
      - dependency-name: "melodic-software/ci-workflows/*"
  # Keep the npm dev-dependencies current — the root devDependency pins
  # (linters, parsers, and the lefthook hooks runner).
  - package-ecosystem: npm
    directory: /
    labels: ["dependencies"]
    open-pull-requests-limit: 5
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    # Batch minor and patch bumps into one PR; majors stay individual so
    # breaking changes get their own review.
    groups:
      npm-minor-patch:
        update-types:
          - "minor"
          - "patch"
  # The runner policy is distributed with its own runtime lockfile, so it is a
  # separate npm dependency root. This source entry is the only version-update
  # coverage; consumers must not add a nested
  # `/.github/standards/runner-policy` Dependabot directory (byte-exact sync
  # would revert a downstream bump). Alerts still report that nested lockfile.
  - package-ecosystem: npm
    directory: /components/runner-policy
    labels: ["dependencies"]
    open-pull-requests-limit: 5
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    groups:
      npm-minor-patch:
        update-types:
          - "minor"
          - "patch"
  # The concurrency policy analyzer is distributed with its own runtime
  # lockfile, so it is a separate npm dependency root. Keep this entry in sync
  # with that component; every downstream materialization must add the
  # equivalent destination path.
  - package-ecosystem: npm
    directory: /components/concurrency-policy
    labels: ["dependencies"]
    open-pull-requests-limit: 5
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    groups:
      npm-minor-patch:
        update-types:
          - "minor"
          - "patch"
  # The naming-lint analyzer carries its own runtime lockfile, so it is a
  # separate npm dependency root.
  - package-ecosystem: npm
    directory: /components/github-actions-conventions
    labels: ["dependencies"]
    open-pull-requests-limit: 5
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    groups:
      npm-minor-patch:
        update-types:
          - "minor"
          - "patch"
  # The pr-convention policy analyzer is distributed with its own runtime
  # lockfile, so it is a separate npm dependency root. Keep this entry in sync
  # with that component; every downstream materialization must add the
  # equivalent destination path.
  - package-ecosystem: npm
    directory: /components/pr-convention-policy
    labels: ["dependencies"]
    open-pull-requests-limit: 5
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    groups:
      npm-minor-patch:
        update-types:
          - "minor"
          - "patch"
  # The dependabot policy analyzer is distributed with its own runtime
  # lockfile, so it is a separate npm dependency root. Keep this entry in sync
  # with that component; every downstream materialization must add the
  # equivalent destination path.
  - package-ecosystem: npm
    directory: /components/dependabot-policy
    labels: ["dependencies"]
    open-pull-requests-limit: 5
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    groups:
      npm-minor-patch:
        update-types:
          - "minor"
          - "patch"
  # Distribution validation is an independent runtime dependency root.
  - package-ecosystem: npm
    directory: /distribution
    labels: ["dependencies"]
    open-pull-requests-limit: 5
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    groups:
      npm-minor-patch:
        update-types:
          - "minor"
          - "patch"
