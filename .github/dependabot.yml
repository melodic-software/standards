version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    labels: ["dependencies"]
    open-pull-requests-limit: 5
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    # A dependency joins the first group it matches, so majors fall through to `github-actions`:
    # https://docs.github.com/en/code-security/dependabot/working-with-dependabot/dependabot-options-reference
    groups:
      vendor-actions:
        patterns:
          - "actions/*"
          - "github/*"
          - "anthropics/*"
        update-types: ["minor", "patch"]
      github-actions:
        patterns:
          - "*"
  - package-ecosystem: npm
    directory: /
    labels: ["dependencies"]
    open-pull-requests-limit: 5
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    groups:
      npm-minor-patch:
        update-types:
          - "minor"
          - "patch"
  - package-ecosystem: npm
    directory: /components/runner-policy
    labels: ["dependencies"]
    open-pull-requests-limit: 5
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    groups:
