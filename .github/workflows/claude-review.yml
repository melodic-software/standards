name: claude-review

# Automated PR code review via the ci-workflows reusable workflow. The caller
# owns the triggers + GITHUB_TOKEN permission grant (a called workflow can only
# downgrade them, never elevate); the reusable workflow owns the action pin, the
# model, and the secret-handling model.
#
# Repo-local rather than the sync-managed `claude-review-caller` component
# (melodic-software/standards, components/claude-lanes/claude-review.yml): this
# repository is the manifest SOURCE, not a sync target. It tracks that component
# except where a documented constraint forces a deviation — see the trigger,
# concurrency, and runner notes below.
#
# The reusable skips drafts, fork PRs (they receive no secrets and a read-only
# token) and every `[bot]` actor, so none of them is reviewed by design.

on:
  pull_request:
    # `synchronize` reviews every push, including the push that resolves a
    # merge conflict, matching components/claude-lanes/claude-review.yml:
    # GitHub runs no pull_request workflow while a PR conflicts with its base.
    #
    # Re-running the job does NOT review a newer head: a re-run replays the
    # ORIGINAL event payload. Push, reopen, or mark the PR draft and ready
    # again.
    types: [opened, synchronize, ready_for_review, reopened]

permissions:
  contents: read

# Per-PR supersede group: a newer event for the same PR cancels the older run,
# so a rapid open→ready→reopen burst spends one review, not several.
#
# The `${{ github.workflow }}`-prefixed canonical group is what this
# repository's own `concurrency-policy` component requires
# (`.github/workflows/ci.yml`, `Enforce concurrency policy on standards`),
# and it is the form the component ships.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  review:
    # A draft is work in progress and does not spend a review; the
    # ready_for_review trigger above is what delivers one when it is ready.
    if: github.event.pull_request.draft == false
    permissions:
      contents: read         # checkout + read the diff
      pull-requests: write   # post review + track_progress tracking comment
      id-token: write        # OIDC — mints the Claude GitHub App token (required
                             # even with an OAuth/API-key credential)
    uses: melodic-software/ci-workflows/.github/workflows/claude-review.yml@35880dcbb2f174aac90159e276dc7eddf1bc20b9 # v0.30.1
    with:
      # DEVIATION from the component, which names the managed fleet label:
      # this repository is PUBLIC, and runner-policy admits a fleet label only
      # for an enrolled private consumer (`public-self-hosted-routing`
      # otherwise), so this caller pins the approved hosted label directly.
      runner: ubuntu-24.04
    # Pass only the one named secret (least privilege) rather than `secrets:
    # inherit`, which would forward every parent secret to the called workflow.
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

