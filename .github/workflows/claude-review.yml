name: claude-review

# Automated PR code review via the ci-workflows reusable workflow. The caller
# owns the triggers + GITHUB_TOKEN permission grant (a called workflow can only
# downgrade them, never elevate); the reusable workflow owns the action pin, the
# model, the cadence guards, the kill-switches, and the secret-handling model.
#
# Repo-local rather than the sync-managed `claude-review-caller` component
# (melodic-software/standards, components/claude-lanes/claude-review.yml): this
# repository is the manifest SOURCE, not a sync target. It tracks that component
# except where a documented constraint forces a deviation — see the trigger,
# concurrency, and runner notes below.
#
# Fork PRs receive no secrets and a read-only token, so they are simply not
# reviewed by design (no token-exfiltration surface).

on:
  pull_request:
    # `synchronize` reviews every push, including the push that resolves a
    # merge conflict, matching components/claude-lanes/claude-review.yml:
    # GitHub runs no pull_request workflow while a PR conflicts with its base.
    # The reusable's `max-reviews-per-pr` (default 5) caps reviewed pushes.
    #
    # Re-running the job does NOT review a newer head: a re-run replays the
    # ORIGINAL event payload, so the reusable's freshness guard retires it as
    # superseded. Push, reopen, or mark the PR draft and ready again.
    types: [opened, synchronize, ready_for_review, reopened]

permissions:
  contents: read

# Per-PR supersede group: a newer event for the same PR cancels the older run,
# so a rapid open→ready→reopen burst spends one review, not several. Distinct
# by construction from the reusable's inner job-level group, which appends the
# head SHA (`claude-review-<PR>-<headSHA>`), so no caller/inner same-name
# deadlock is possible.
#
# The `${{ github.workflow }}`-prefixed canonical group is what this
# repository's own `concurrency-policy` component requires
# (`.github/workflows/ci.yml`, `Enforce concurrency policy on standards`),
# and it is the form the component ships.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  review:
    permissions:
      contents: read         # checkout + read the diff
      pull-requests: write   # post review + track_progress tracking comment
      id-token: write        # OIDC — mints the Claude GitHub App token (required
                             # even with an OAuth/API-key credential)
    # Repo-wide review queue — a SEPARATE block from the workflow-level cancel
    # group above, because `queue: max` cannot be combined with
    # `cancel-in-progress: true`, the value that block sets
    # (https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-syntax#jobsjob_idconcurrency)
    # — and because this group is job-scoped and repo-wide, not per-PR.
    # Serializes reviews repo-wide so parallel PRs queue for the shared Claude
    # seat instead of contending for it.
    concurrency:
      group: claude-review-${{ github.repository }}
      queue: max
    uses: melodic-software/ci-workflows/.github/workflows/claude-review.yml@4610c31e92eb1c4b24981e2f200ac87bdb2a1753 # v0.27.1
    with:
      # DEVIATION from the component, which resolves the runner through the
      # governed selector: this repository is PUBLIC, and runner-policy admits
      # the selector only for an enrolled private consumer
      # (`components/runner-policy/README.md`, "Public repositories and
      # repositories not enrolled for local CI cannot call the selector"), so
      # this caller pins the approved hosted label directly.
      runner: ubuntu-24.04
      # No `skip-actors`: the reusable's default carries the self-trigger ban
      # (Claude and the org's automation bots must never trigger their own
      # lanes). Passing the input would override that default and freeze this
      # lane's ban list at whatever was current when it was written.
    # Pass only the one named secret (least privilege) rather than `secrets:
    # inherit`, which would forward every parent secret to the called workflow.
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

