name: claude-security-review

# Automated PR security review via the ci-workflows reusable workflow, the
# security sibling of claude-review.yml. Advisory: never add any check in this
# file to required status checks (github-iac ADR 0011).
#
# Repo-local rather than the sync-managed `claude-security-review-caller`
# component (components/claude-lanes/claude-security-review.yml): this
# repository is the manifest SOURCE, not a sync target. It tracks that
# component except for the runner note below.
#
# Every non-draft same-repository PR is reviewed; the reusable skips fork PRs
# (they receive no secrets and a read-only token) and every `[bot]` actor.
#
# NEVER add workflow-level `paths:`/`paths-ignore:`: a check whose workflow
# never triggers stays Pending forever.

on:
  pull_request:
    # NO `merge_group:`: the pinned action cannot serve that event; see
    # melodic-software/ci-workflows#272 before enabling a merge queue.
    types: [opened, synchronize, ready_for_review, reopened]

permissions:
  contents: read

# No top-level concurrency block, as in the component: a security review is
# never cancelled. The `delegated-job-level` exception in
# .github/concurrency-policy.json waives the canonical block.

jobs:
  security-review:
    # A draft does not spend a review; ready_for_review delivers one.
    if: github.event.pull_request.draft == false
    permissions:
      contents: read         # checkout + read the diff
      pull-requests: write   # post the security review + tracking comment
      id-token: write        # OIDC, mints the Claude GitHub App token (required
                             # even with an OAuth/API-key credential)
    # Per-PR serialization without cancellation.
    concurrency:
      group: claude-security-review-${{ github.event.pull_request.number || github.run_id }}
      cancel-in-progress: false
    uses: melodic-software/ci-workflows/.github/workflows/claude-security-review.yml@6567856ef6070a4a1c9c2691f610278a7f2de153 # v0.29.0
    with:
      # DEVIATION from the component, which names the managed fleet label:
      # this repository is PUBLIC, and runner-policy admits a managed label
      # only for an enrolled private consumer (`components/runner-policy/README.md`),
      # so this caller pins the approved hosted label directly.
      runner: ubuntu-24.04
    # Pass only the one named secret (least privilege) rather than `secrets:
    # inherit`, which would forward every parent secret to the called workflow.
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
