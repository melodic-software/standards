name: maintenance-sync-standards

# Exact-file distribution: standards owns desired bytes and ci-workflows owns
# GitHub orchestration. Every real run opens or refreshes one reviewed PR per
# target; it never writes directly to a target's default branch. Public repo:
# runs on the reusable's hosted default runner.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry-run:
        description: Plan only — log the per-target file set; no PRs opened.
        type: boolean
        default: true
      targets:
        description: >-
          Comma-separated allowlist of manifest targets (owner/name) to sync;
          empty means all. Pilot / staged-rollout control.
        type: string
        default: ''
  schedule:
    # Off-minute weekly reconciliation catches interrupted or missed cascades.
    - cron: "17 6 * * 1"

permissions:
  contents: read

jobs:
  # A burst of merges would otherwise start one full sync (and refresh every
  # target PR, re-running its CI) per push. A push waits out a quiet window
  # first; a newer push cancels the older run's wait before any mutation, so a
  # burst yields one sync per target. Schedule and dispatch skip the wait.
  # Tune the window with the STANDARDS_SYNC_SETTLE_SECONDS repo variable
  # (integer seconds, 0-3600; default 600).
  settle:
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    permissions: {}
    concurrency:
      group: standards-sync-settle
      cancel-in-progress: true
    steps:
      - name: Wait for the push burst to settle
        env:
          SETTLE_SECONDS: ${{ vars.STANDARDS_SYNC_SETTLE_SECONDS || 600 }}
        run: |
          if ! [[ "$SETTLE_SECONDS" =~ ^[0-9]+$ ]] || (( ${#SETTLE_SECONDS} > 4 || 10#$SETTLE_SECONDS > 3600 )); then
            echo "::error::STANDARDS_SYNC_SETTLE_SECONDS must be an integer from 0 to 3600, got '$SETTLE_SECONDS'"
            exit 1
          fi
          sleep "$((10#$SETTLE_SECONDS))"

  maintenance-sync-standards:
    needs: settle
    if: ${{ !cancelled() && (needs.settle.result == 'success' || needs.settle.result == 'skipped') }}
    # Real runs attest App access for the complete unfiltered manifest before
    # mutation; `targets` limits reconciliation only, never attestation.
    uses: melodic-software/ci-workflows/.github/workflows/maintenance-sync-standards.yml@main
    with:
      runner: ubuntu-24.04
      # Schedule and push run for real (inputs is empty on those events, so
      # `|| false` makes them real runs); manual dispatch keeps its dry-run
      # preview default. Do NOT flip to `== 'schedule'` — that inverts it and
      # the weekly cascade would silently never fire.
      dry-run: ${{ inputs.dry-run || false }}
      targets: ${{ inputs.targets || '' }}
    secrets:
      STANDARDS_SYNC_APP_CLIENT_ID: ${{ secrets.STANDARDS_SYNC_APP_CLIENT_ID }}
      STANDARDS_SYNC_APP_PRIVATE_KEY: ${{ secrets.STANDARDS_SYNC_APP_PRIVATE_KEY }}
