name: Maintenance Sync Standards

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry-run:
        description: Plan only — log the per-target file set; no PRs opened.
        type: boolean
        default: true
      targets:
        description: >-
          Comma-separated allowlist of manifest targets (owner/name) to sync;
          empty means all. Pilot / staged-rollout control.
        type: string
        default: ''
  schedule:
    - cron: "17 6 * * 1"

permissions:
  contents: read

jobs:
  # A group holds one pending run and a newer push replaces it, so a burst yields one sync:
  # https://docs.github.com/en/actions/how-tos/write-workflows/choose-when-workflows-run/control-workflow-concurrency
  collect-merge-burst:
    name: Collect Merge Burst
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    permissions: {}
    concurrency:
      group: standards-sync-settle
      cancel-in-progress: false
    steps:
      - name: Wait for the push burst to settle
        env:
          SETTLE_SECONDS: ${{ vars.STANDARDS_SYNC_SETTLE_SECONDS || 600 }}
        run: |
          if ! [[ "$SETTLE_SECONDS" =~ ^[0-9]+$ ]] || (( ${#SETTLE_SECONDS} > 4 || 10#$SETTLE_SECONDS > 3600 )); then
            echo "::error::STANDARDS_SYNC_SETTLE_SECONDS must be an integer from 0 to 3600, got '$SETTLE_SECONDS'"
            exit 1
          fi
          sleep "$((10#$SETTLE_SECONDS))"

  maintenance-sync-standards:
    name: Maintenance Sync Standards
    needs: collect-merge-burst
    if: ${{ !cancelled() && (needs.collect-merge-burst.result == 'success' || needs.collect-merge-burst.result == 'skipped') }}
    uses: melodic-software/ci-workflows/.github/workflows/maintenance-sync-standards.yml@main
    with:
      runner: ubuntu-24.04
      # `inputs` is unavailable on push and schedule, so `|| false` makes those real runs:
      # https://docs.github.com/en/actions/reference/workflows-and-actions/contexts#inputs-context
      dry-run: ${{ inputs.dry-run || false }}
      targets: ${{ inputs.targets || '' }}
    secrets:
      STANDARDS_SYNC_APP_CLIENT_ID: ${{ secrets.STANDARDS_SYNC_APP_CLIENT_ID }}
      STANDARDS_SYNC_APP_PRIVATE_KEY: ${{ secrets.STANDARDS_SYNC_APP_PRIVATE_KEY }}
