name: PR Automerge Dependabot

on:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions: {}

jobs:
  pr-automerge-dependabot:
    name: PR Automerge Dependabot
    permissions:
      contents: write
      pull-requests: write
    uses: melodic-software/ci-workflows/.github/workflows/pr-automerge-dependabot.yml@main
    with:
      runner: ubuntu-24.04
      review-only-dependencies: '["yaml"]'
