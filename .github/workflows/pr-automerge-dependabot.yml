name: pr-automerge-dependabot

# Thin caller of the org's pr-automerge-dependabot reusable workflow
# (melodic-software/ci-workflows). It arms GitHub auto-merge (squash) on
# Dependabot minor and patch bumps under the merge tiers in
# components/dependabot-policy/README.md: GitHub Actions from `tier: auto`
# publishers, and npm, pip and NuGet packages outside
# `review-only-dependencies` (this repository's `autoMerge.reviewOnly`
# entries). Arming never merges: GitHub merges once every required check,
# `ci-status` included, passes.

on:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions: {}

jobs:
  pr-automerge-dependabot:
    permissions:
      contents: write # enablePullRequestAutoMerge
      pull-requests: write # enable or disable auto-merge on the PR
    uses: melodic-software/ci-workflows/.github/workflows/pr-automerge-dependabot.yml@main
    with:
      # Public repository: runner-policy admits only a hosted label here.
      runner: ubuntu-24.04
      review-only-dependencies: '["yaml"]'
