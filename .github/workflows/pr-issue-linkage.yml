name: pr-issue-linkage

# Standalone required check that validates the PR body carries a native closing
# keyword and a non-empty Related section. It runs on pull_request_target so the
# base-branch definition gates and a head-branch edit cannot bypass it; it reads
# body metadata from the event payload only and checks out no head code. The
# emitted required-check context is `pr-issue-linkage / pr-issue-linkage`.
# Public repo: runs on the reusable's hosted default runner.
on:
  # zizmor: ignore[dangerous-triggers] metadata-only gate; rationale in the header comment
  pull_request_target:
    types: [opened, edited, reopened, synchronize]
  merge_group:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  pr-issue-linkage:
    permissions: {}
    uses: melodic-software/ci-workflows/.github/workflows/pr-issue-linkage.yml@c136b27f404dd32ce3873f39a6f3443891d1c16e # c136b27 2026-07-27 v0.9.1
    with:
      runner: ubuntu-24.04
      # Dependabot owns its generated body and cannot add this repository's
      # closing-keyword + Related markers. Keep the exemption exact-login only.
      exempt-authors: 'dependabot[bot]'
