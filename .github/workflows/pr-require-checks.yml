        run: npm install --global typescript@5.9.3 && test "$(tsc --version)" = "Version 5.9.3" && bash harness/shell/run-tests.sh components/tsconfig/tsconfig.test.sh # zizmor: ignore[adhoc-packages] exact-pinned toolchain installed on PATH so the tsconfig contract test can drive tsc directly
      - name: Test packed tsconfig contract on TypeScript 6.0.3
        if: ${{ !cancelled() }}
        run: npm install --global typescript@6.0.3 && test "$(tsc --version)" = "Version 6.0.3" && bash harness/shell/run-tests.sh components/tsconfig/tsconfig.test.sh # zizmor: ignore[adhoc-packages] exact-pinned toolchain installed on PATH so the tsconfig contract test can drive tsc directly
      - name: Test packed tsconfig contract on TypeScript 7.0.2
        if: ${{ !cancelled() }}
        run: npm install --global typescript@7.0.2 && test "$(tsc --version)" = "Version 7.0.2" && bash harness/shell/run-tests.sh components/tsconfig/tsconfig.test.sh # zizmor: ignore[adhoc-packages] exact-pinned toolchain installed on PATH so the tsconfig contract test can drive tsc directly
      - name: Install biome and tsc
        if: ${{ !cancelled() }}
        run: npm install -g "@biomejs/biome@${BIOME_VERSION}" "typescript@${TYPESCRIPT_VERSION}" # zizmor: ignore[adhoc-packages] exact-pinned tools installed on PATH so the biome/tsconfig contract tests can assert rule codes directly
      - name: Verify toolchain
        if: ${{ !cancelled() }}
        run: |
          biome --version
          tsc --version
      - name: Biome contract test
        if: ${{ !cancelled() }}
        run: bash harness/shell/run-tests.sh components/biome/biome.test.sh
      - name: TypeScript config contract test
        if: ${{ !cancelled() }}
        run: bash harness/shell/run-tests.sh components/tsconfig/tsconfig.test.sh

  check-dotnet:
    if: ${{ !(github.event.pull_request.head.repo.full_name == github.repository && (contains(fromJSON('["labeled","unlabeled"]'), github.event.action) || (github.event.action == 'edited' && !github.event.changes.base))) }}
    permissions:
      contents: read
      pull-requests: read
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      # The rootless fleet has no write access to setup-dotnet's Linux default.
      # Keep hosted/local parity by selecting a per-job ephemeral directory.
      DOTNET_INSTALL_DIR: ~/.dotnet
      # Inline install — the fixtures suite asserts specific rule codes fire on
      # the bad fixture, which needs the SDK on PATH (the dotnet-build/dotnet-format
      # actions only pass/fail). Keep in lockstep with the action defaults in
      # ci-workflows and with medley.
      DOTNET_VERSION: 10.0.301
    steps:
      - name: Detect relevant changes
        id: changes
        uses: melodic-software/ci-workflows/.github/actions/detect-changes@ab83b01273026ab5c23c6f3b40e946d97a863fa2 # v0.39.3
        with:
          filters: |
            dotnet:
              .github/workflows/pr-require-checks.yml
              harness/shell/**
              .node-version
              .editorconfig
              .gitattributes
              .lefthook/dotnet-format.json
              components/dotnet-analysis/**
              components/lefthook-dotnet/**
              Directory.Build.*
              Directory.Packages.props
              global.json
              nuget.config
              NuGet.config
              NuGet.Config
      - name: Check out
        if: ${{ fromJSON(steps.changes.outputs.results || '{}')['dotnet'] != 'false' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The fixture tests run first, while DOTNET_VERSION is the only SDK in
      # DOTNET_INSTALL_DIR. The build and format actions then install the SDK
      # passed below, which is newer, so each step runs the SDK it ran alone.
      - name: Set up .NET
        if: ${{ !cancelled() && fromJSON(steps.changes.outputs.results || '{}')['dotnet'] != 'false' }}
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Set up Node
        if: ${{ !cancelled() && fromJSON(steps.changes.outputs.results || '{}')['dotnet'] != 'false' }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - name: Verify toolchain
        if: ${{ !cancelled() && fromJSON(steps.changes.outputs.results || '{}')['dotnet'] != 'false' }}
        run: |
          dotnet --version
          node --version
      - name: .NET analysis contract test
        if: ${{ !cancelled() && fromJSON(steps.changes.outputs.results || '{}')['dotnet'] != 'false' }}
        run: bash harness/shell/run-tests.sh components/dotnet-analysis/dotnet-analysis.test.sh
      - name: .NET staged-adapter integration
        if: ${{ !cancelled() && fromJSON(steps.changes.outputs.results || '{}')['dotnet'] != 'false' }}
        run: >-
          node components/lefthook-dotnet/dotnet-format-staged.mjs
          components/dotnet-analysis/fixtures/good/Calculator.cs
        env:
          DOTNET_FORMAT_WORKSPACE: components/dotnet-analysis/fixtures/good/good.csproj
      - name: Build .NET (analyzers + code-style as errors)
        # The shipped base carries no project scope, so scope the build at the
        # conforming fixture, which imports the base props (the bad fixture is
        # non-conforming by design).
        if: ${{ !cancelled() && fromJSON(steps.changes.outputs.results || '{}')['dotnet'] != 'false' }}
        uses: melodic-software/ci-workflows/.github/actions/dotnet-build@ab83b01273026ab5c23c6f3b40e946d97a863fa2 # v0.39.3
        with:
          dotnet-version: 10.0.400
          project: components/dotnet-analysis/fixtures/good/good.csproj
      - name: Verify .NET whitespace
        if: ${{ !cancelled() && fromJSON(steps.changes.outputs.results || '{}')['dotnet'] != 'false' }}
        uses: melodic-software/ci-workflows/.github/actions/dotnet-format@ab83b01273026ab5c23c6f3b40e946d97a863fa2 # v0.39.3
        with:
          dotnet-version: 10.0.400
          project: components/dotnet-analysis/fixtures/good/good.csproj

  check-go:
    if: ${{ !(github.event.pull_request.head.repo.full_name == github.repository && (contains(fromJSON('["labeled","unlabeled"]'), github.event.action) || (github.event.action == 'edited' && !github.event.changes.base))) }}
    permissions:
      contents: read
      pull-requests: read
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GO_VERSION: 1.26.5
      GOLANGCI_LINT_VERSION: 2.12.2
      GOLANGCI_LINT_SHA256: 8df580d2670fed8fa984aac0507099af8df275e665215f5c7a2ae3943893a553
    steps:
      - name: Detect relevant changes
        id: changes
        uses: melodic-software/ci-workflows/.github/actions/detect-changes@ab83b01273026ab5c23c6f3b40e946d97a863fa2 # v0.39.3
        with:
          filters: |
            go:
              .github/workflows/pr-require-checks.yml
              harness/shell/**
              .golangci.yml
              .gitattributes
              go.work
              go.work.sum
              components/go-analysis/**
      - name: Check out
        if: ${{ fromJSON(steps.changes.outputs.results || '{}')['go'] != 'false' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        if: ${{ fromJSON(steps.changes.outputs.results || '{}')['go'] != 'false' }}
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - name: Install golangci-lint from the official release
        if: ${{ fromJSON(steps.changes.outputs.results || '{}')['go'] != 'false' }}
        run: |
          set -euo pipefail
          archive="golangci-lint-${GOLANGCI_LINT_VERSION}-linux-amd64.tar.gz"
          url="https://github.com/golangci/golangci-lint/releases/download/v${GOLANGCI_LINT_VERSION}/${archive}"
          curl -q --fail --silent --show-error --location \
            --proto '=https' --proto-redir '=https' \
            --connect-timeout 10 --max-time 120 \
            --retry 2 --retry-max-time 300 \
            --output "$archive" -- "$url"
          echo "${GOLANGCI_LINT_SHA256}  ${archive}" | sha256sum -c -
          tar -xzf "$archive"
          install_dir="$RUNNER_TEMP/standards-bin"
          mkdir -p "$install_dir"
          install -m 0755 \
            "golangci-lint-${GOLANGCI_LINT_VERSION}-linux-amd64/golangci-lint" \
            "$install_dir/golangci-lint"
          echo "$install_dir" >> "$GITHUB_PATH"
          rm -rf "$archive" "golangci-lint-${GOLANGCI_LINT_VERSION}-linux-amd64"
      - name: Verify exact toolchain
        if: ${{ fromJSON(steps.changes.outputs.results || '{}')['go'] != 'false' }}
        run: |
          test "$(go env GOVERSION)" = "go${GO_VERSION}"
          golangci-lint version | grep -F "version ${GOLANGCI_LINT_VERSION}"
      - name: Go analysis contract test
        if: ${{ fromJSON(steps.changes.outputs.results || '{}')['go'] != 'false' }}
        run: bash harness/shell/run-tests.sh components/go-analysis/go-analysis.test.sh

  check-policies:
    if: ${{ !(github.event.pull_request.head.repo.full_name == github.repository && (contains(fromJSON('["labeled","unlabeled"]'), github.event.action) || (github.event.action == 'edited' && !github.event.changes.base))) }}
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node
        if: ${{ !cancelled() }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: |
            package-lock.json
            components/runner-policy/package-lock.json
            components/concurrency-policy/package-lock.json
            components/dependabot-policy/package-lock.json
            components/pr-convention-policy/package-lock.json
      - name: Install policy dependencies
        if: ${{ !cancelled() }}
        run: |
          npm ci
          npm ci --prefix components/runner-policy
          npm ci --prefix components/concurrency-policy
          npm ci --prefix components/dependabot-policy
          npm ci --prefix components/pr-convention-policy
      - name: Test package lifecycle
        if: ${{ !cancelled() }}
        run: npm run test:packages
      - name: Enforce package lifecycle
        if: ${{ !cancelled() }}
        env:
          PACKAGE_BASE_REF: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: node harness/packages/package-lifecycle.mjs
      - name: Test runner policy
        if: ${{ !cancelled() }}
        run: npm run test:runner-policy
      - name: Enforce runner policy on standards
        if: ${{ !cancelled() }}
        run: npm run lint:runner-policy
        env:
          CI_REPOSITORY_VISIBILITY: ${{ github.event.repository.visibility }}
      - name: Test concurrency policy
        if: ${{ !cancelled() }}
        run: npm run test:concurrency-policy
      - name: Enforce concurrency policy on standards
        if: ${{ !cancelled() }}
        run: npm run lint:concurrency-policy
      - name: Test dependabot policy
        if: ${{ !cancelled() }}
        run: npm run test:dependabot-policy
      - name: Enforce dependabot policy on standards
        if: ${{ !cancelled() }}
        run: npm run lint:dependabot-policy
      # Reads the public ci-workflows reusable at an immutable pinned SHA, so
      # the only non-hermetic input is the fetch itself. Blocking from
      # admission: see components/dependabot-policy/README.md "Merge lanes".
      - name: Enforce the auto-merge allowlist lockstep with ci-workflows
        if: ${{ !cancelled() }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: npm run lint:dependabot-automerge-lockstep
      - name: Test pr-convention policy
        if: ${{ !cancelled() }}
        run: npm run test:pr-convention-policy
      - name: Enforce pr-convention policy sample
        if: ${{ !cancelled() }}
        run: npm run lint:pr-convention-policy

  # Lockstep drift check (ADR-0008), copy half. Separate job, not a step in
  # check-policies: the live run fetches the gate composite, the plugin hook
  # validator and the org PR template over the network, and that
  # non-hermetic dependency must not contaminate the hermetic component lane.
  # The fixture tests run first so a parser regression reads as a test
  # failure, not as drift. Every copy lives in a public repository, so the
  # workflow token suffices; the caller-pin half reads private repositories
  # and runs on main in maintenance-audit-pr-convention-pins.yml.
  check-pr-convention-copies:
    if: ${{ !(github.event.pull_request.head.repo.full_name == github.repository && (contains(fromJSON('["labeled","unlabeled"]'), github.event.action) || (github.event.action == 'edited' && !github.event.changes.base))) }}
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: components/pr-convention-policy/package-lock.json
      - name: Install pr-convention-policy dependencies
        run: npm ci --prefix components/pr-convention-policy
      # The lockstep check runs the composite's awk analyzer under
      # `gawk --sandbox` (system(), pipes and redirection disabled), and the
      # runner image's awk is not guaranteed to be gawk. Missing gawk fails the
      # check rather than skipping it, so install it before either step.
      - name: Ensure gawk for the sandboxed analyzer run
        run: |
          set -euo pipefail
          if ! command -v gawk >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq --no-install-recommends gawk
          fi
          gawk --version | head -n 1
      - name: Test lockstep parsers and mutation probes (hermetic)
        run: npm run test:pr-convention-lockstep
      - name: Enforce lockstep against the live copies
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: npm run lint:pr-convention-copies

  check-github-actions:
    if: ${{ !(github.event.pull_request.head.repo.full_name == github.repository && (contains(fromJSON('["labeled","unlabeled"]'), github.event.action) || (github.event.action == 'edited' && !github.event.changes.base))) }}
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Lint workflows
        if: ${{ !cancelled() }}
        uses: melodic-software/ci-workflows/.github/actions/actionlint@ab83b01273026ab5c23c6f3b40e946d97a863fa2 # v0.39.3
      - name: Test actionlint component
        if: ${{ !cancelled() }}
        run: bash harness/shell/run-tests.sh components/actionlint/actionlint.test.sh
      # The lane caller tests materialize each target through the distribution
      # engine before linting, and the pin-comment scan reads YAML, so this job
      # needs the engine's yq the same way test-distribution does.
      - name: Install yq 4.53.3
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          version=4.53.3
          sha=fa52a4e758c63d38299163fbdd1edfb4c4963247918bf9c1c5d31d84789eded4
          url="https://github.com/mikefarah/yq/releases/download/v${version}/yq_linux_amd64"
          curl -fsSL "$url" -o yq
          echo "${sha}  yq" | sha256sum -c -
          sudo install yq /usr/local/bin/yq
          rm yq
          yq --version
      # Phase 6 cutover prep: once sync-manifest.sh becomes the exec wrapper,
      # the engine this job runs through claude-lanes.test.sh needs Node and
      # the distribution dependencies. Inert while the Bash engine is live.
      - name: Set up Node
        if: ${{ !cancelled() }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: |
            distribution/package-lock.json
            components/runner-policy/package-lock.json
            components/github-actions-conventions/package-lock.json
      # The lockstep suite imports repin-policy-lockstep.mjs, which imports
      # runner-policy.mjs and therefore needs that component's ajv install.
      - name: Install distribution, runner-policy and naming-lint dependencies
        if: ${{ !cancelled() }}
        run: |
          npm ci --prefix distribution
          npm ci --prefix components/runner-policy
          npm ci --prefix components/github-actions-conventions
      # The lint above covers .github/workflows only, so the lane caller
      # components — workflow bytes that live outside it until a sync
      # materializes them — need the consumer entrypoint run over them here,
      # in the one job that has the pinned engine installed.
      - name: Test claude lane caller components
        if: ${{ !cancelled() }}
        run: bash harness/shell/run-tests.sh components/claude-lanes/claude-lanes.test.sh
      # Same shape, same reason: the managed-files-guard caller is workflow
      # bytes that live outside .github/workflows until a sync materializes
      # them, so the consumer entrypoint runs over them here too.
      - name: Test the managed-files-guard caller component
        if: ${{ !cancelled() }}
        run: bash harness/shell/run-tests.sh components/managed-files-guard/managed-files-guard.test.sh
      - name: Test the lane caller re-pin script
        if: ${{ !cancelled() }}
        run: bash harness/shell/run-tests.sh components/claude-lanes/repin-callers.test.sh
      - name: Test lockstep argv accepts a mixed old-sha set
        if: ${{ !cancelled() }}
        run: node --test components/claude-lanes/repin-policy-lockstep.test.mjs
      - name: Check ci-workflows pin-comment convention (this repo's own workflow files)
        # GitHub accepts both .yml and .yaml for workflow files (this repo's own
        # index has only .yml today, but a future .yaml workflow must not silently
        # escape the scan — the driver's `[[ -f "$file" ]] || continue` guard
        # already tolerates a glob with no current matches).
        #
        # components/claude-lanes/, components/claude-lanes-hosted/ and
        # components/managed-files-guard/ hold workflow BYTES that ship to
        # consumers' .github/workflows/. Every workflow-shaped lane in this
        # repo discovers files by that location,
        # so the caller components are invisible to all of them; scanning them
        # here keeps their pins under the same convention the files they
        # become are held to.
        if: ${{ !cancelled() }}
        run: bash components/pin-comment-convention/scan-workflow-files.sh .github/workflows/*.yml .github/workflows/*.yaml components/claude-lanes/*.yml components/claude-lanes-hosted/*.yml components/managed-files-guard/*.yml
      - name: Pin-comment-convention contract test
        if: ${{ !cancelled() }}
        run: bash harness/shell/run-tests.sh components/pin-comment-convention/pin-comment-convention.test.sh
      - name: Test naming conventions
        if: ${{ !cancelled() }}
        run: npm run test:github-actions-conventions
      # Findings go to the step summary and the log, not annotations: GitHub
      # shows only ten annotations per step. The last line is the finding
      # count. Enforcing mode fails the step on any blocking finding.
      - name: Check naming conventions on standards
        if: ${{ !cancelled() }}
        run: |
          set -uo pipefail
          report="$RUNNER_TEMP/naming-lint.txt"
          status=0
          npm run --silent lint:github-actions-conventions -- --format text > "$report" || status=$?
          {
            echo '### naming-lint (enforcing)'
            echo '```text'
            cat "$report"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          cat "$report"
          exit "$status"

  pr-audit-workflows:
    if: ${{ !(github.event.pull_request.head.repo.full_name == github.repository && (contains(fromJSON('["labeled","unlabeled"]'), github.event.action) || (github.event.action == 'edited' && !github.event.changes.base))) }}
    permissions:
      contents: read
      # The reusable's own job declares security-events: write unconditionally;
      # its upload-sarif step stays gated on the input, but
      # expressions are not legal in a permissions scope. A called workflow can
      # only narrow the caller's GITHUB_TOKEN and never widen it, so the grant
      # has to be here for the job to start. The lane stays annotations-only
      # (upload-sarif defaults false), so nothing is written to code scanning.
      security-events: write
    # Actions security lint. High-severity findings block the lane; lower
    # severities annotate. Gating runs in-lane via the SARIF guard, so it
    # rides the existing ci-status gate — no code-scanning upload.
    #
    # `.` audits this repo's own workflows only: zizmor discovers workflow
    # definitions by their `.github/workflows` location, so the workflow BYTES
    # under components/claude-lanes/, components/claude-lanes-hosted/ and
    # components/managed-files-guard/, which become consumers'
    # .github/workflows/ files, are invisible to a repo-root scan. They are named explicitly so the lane audits what it
    # ships.
    uses: melodic-software/ci-workflows/.github/workflows/pr-audit-workflows.yml@ab83b01273026ab5c23c6f3b40e946d97a863fa2 # v0.39.3
    with:
      runner: ubuntu-24.04
      paths: . components/claude-lanes/claude-review.yml components/claude-lanes/claude-security-review.yml components/claude-lanes-hosted/claude-review.yml components/claude-lanes-hosted/claude-security-review.yml components/managed-files-guard/managed-files-guard.yml components/managed-files-guard/managed-files-guard-fleet.yml
      fail-on-severity: high

  pr-scan-dependencies:
    if: ${{ !(github.event.pull_request.head.repo.full_name == github.repository && (contains(fromJSON('["labeled","unlabeled"]'), github.event.action) || (github.event.action == 'edited' && !github.event.changes.base))) }}
    permissions:
      contents: read
    # Advisory dependency vuln scan; reports against package-lock.json without
    # blocking (fail-on-vuln defaults false). Annotation mode needs no
    # security-events write grant.
    uses: melodic-software/ci-workflows/.github/workflows/pr-scan-dependencies.yml@ab83b01273026ab5c23c6f3b40e946d97a863fa2 # v0.39.3
    with:
      runner: ubuntu-24.04

  test-cloud-environment:
    if: ${{ !(github.event.pull_request.head.repo.full_name == github.repository && (contains(fromJSON('["labeled","unlabeled"]'), github.event.action) || (github.event.action == 'edited' && !github.event.changes.base))) }}
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Cloud contract tests (environment + bootstrap)
        if: ${{ !cancelled() }}
        run: >-
          bash harness/shell/run-tests.sh
          components/cloud-environment/setup.test.sh
          components/cloud-environment/vault-exec.test.sh
          components/cloud-environment/pages-publish.test.sh
          components/cloud-bootstrap/cloud-bootstrap.test.sh
          .cursor/install.test.sh
      - name: Set up Node
        if: ${{ !cancelled() }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - name: MCP launcher --vault tests
        if: ${{ !cancelled() }}
        run: node --test components/mcp-launcher/launcher.test.mjs

  test-distribution:
    if: ${{ !(github.event.pull_request.head.repo.full_name == github.repository && (contains(fromJSON('["labeled","unlabeled"]'), github.event.action) || (github.event.action == 'edited' && !github.event.changes.base))) }}
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: distribution/package-lock.json
      - name: Install distribution dependencies
        run: npm ci --prefix distribution
      - name: Install yq 4.53.3
        run: |
          set -euo pipefail
          version=4.53.3
          sha=fa52a4e758c63d38299163fbdd1edfb4c4963247918bf9c1c5d31d84789eded4
          url="https://github.com/mikefarah/yq/releases/download/v${version}/yq_linux_amd64"
          curl -fsSL "$url" -o yq
          echo "${sha}  yq" | sha256sum -c -
          sudo install yq /usr/local/bin/yq
          rm yq
          yq --version
      - name: Test distribution engine
        if: ${{ !cancelled() }}
        run: bash distribution/sync-manifest.test.sh
      - name: Claude-permissions tombstone contract test
        if: ${{ !cancelled() }}
        run: bash harness/shell/run-tests.sh components/claude-permissions/claude-permissions.test.sh
      - name: Trusted-actors list contract test
        if: ${{ !cancelled() }}
        run: node --test components/trusted-actors/trusted-actors.test.mjs
      - name: Claude-settings target conformance test
        if: ${{ !cancelled() }}
        run: bash harness/shell/run-tests.sh distribution/check-claude-settings-targets.test.sh
      - name: Validate production manifest
        if: ${{ !cancelled() }}
        run: bash distribution/sync-manifest.sh validate

  ci-status:
    if: ${{ !cancelled() }}
    permissions:
      # `actions: read` lets the carry-forward wait list the workflow runs on
      # this head SHA, so it can block on an EARLIER incomplete run instead of
      # reading a `ci-lanes` status the full run has not written yet.
      actions: read
      contents: read
      # pr-contract upserts the advisory linkage comment and moves the linkage
      # label; ci-status records the `ci-lanes` commit status the carry-forward
      # branch reads back on the next contract-only event.
      pull-requests: write
      statuses: write
    needs:
      - check-shell
      - check-markdown-and-links
      - check-repo-hygiene
      - check-powershell
      - test-lefthook
      - check-python
      - check-typescript
      - check-dotnet
      - check-go
      - check-policies
      - check-pr-convention-copies
      - check-github-actions
      - pr-audit-workflows
      - pr-scan-dependencies
      - test-cloud-environment
      - test-distribution
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check the pull-request contract
        uses: melodic-software/ci-workflows/.github/actions/pr-require-checks/check-contract@ab83b01273026ab5c23c6f3b40e946d97a863fa2 # v0.39.3
        with:
          token: ${{ github.token }}
          # Carried over from the pr-issue-linkage.yml caller this step
          # replaces, so Dependabot's bodies keep skipping the linkage check
          # rather than starting to fail it. Exact-login match, never a
          # `*[bot]` pattern.
          exempt-authors: 'dependabot[bot]'
      - name: Aggregate lane results
        # `!cancelled()` so a failing pr-contract step does not skip the
        # aggregation: the job still fails on the contract step's exit code,
        # and the `ci-lanes` status is on the SHA for the next contract-only
        # run.
        if: ${{ !cancelled() }}
        uses: melodic-software/ci-workflows/.github/actions/pr-require-checks/aggregate-results@ab83b01273026ab5c23c6f3b40e946d97a863fa2 # v0.39.3
        with:
          treat-skipped-as: fail
          token: ${{ github.token }}
          # The job's `timeout-minutes: 15` minus 60 s, so the wait always
          # loses to the job timeout and a stuck earlier run cannot turn this
          # into a silent 15-minute hang. The ceiling has to cover the full
          # run it waits on: this repository's `pr-require-checks` p95 wall is ~2 minutes
          # (last 20 pull-request runs, 79-127 s), so 840 s is generous.
          carry-forward-wait-seconds: '840'
          results: >-
            ${{ needs.check-shell.result }}
            ${{ needs.check-markdown-and-links.result }}
            ${{ needs.check-repo-hygiene.result }}
            ${{ needs.check-powershell.result }}
            ${{ needs.test-lefthook.result }}
            ${{ needs.check-python.result }}
            ${{ needs.check-typescript.result }}
            ${{ needs.check-dotnet.result }}
            ${{ needs.check-go.result }}
            ${{ needs.check-policies.result }}
            ${{ needs.check-pr-convention-copies.result }}
            ${{ needs.check-github-actions.result }}
            ${{ needs.pr-audit-workflows.result }}
            ${{ needs.pr-scan-dependencies.result }}
            ${{ needs.test-cloud-environment.result }}
            ${{ needs.test-distribution.result }}
