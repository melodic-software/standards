      - name: Verify toolchain
        # Also warms pyright's first-run Node download so the test step is fast.
        if: ${{ !cancelled() && fromJSON(steps.changes.outputs.results || '{}')['python'] != 'false' }}
        run: |
          ruff --version
          pyright --version
      - name: Ruff contract test
        if: ${{ !cancelled() && fromJSON(steps.changes.outputs.results || '{}')['python'] != 'false' }}
        run: bash harness/shell/run-tests.sh components/ruff/ruff.test.sh
      - name: Pyright contract test
        if: ${{ !cancelled() && fromJSON(steps.changes.outputs.results || '{}')['python'] != 'false' }}
        run: bash harness/shell/run-tests.sh components/pyright/pyright.test.sh

  check-typescript:
    if: ${{ !(github.event.pull_request.head.repo.full_name == github.repository && (contains(fromJSON('["labeled","unlabeled"]'), github.event.action) || (github.event.action == 'edited' && !github.event.changes.base))) }}
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      # Inline install — component tests assert specific rule/error codes on
      # the bad fixture, which needs the tools on PATH (the biome/tsc actions
      # only pass/fail). Keep in lockstep with the action defaults in ci-workflows
      # and with medley.
      BIOME_VERSION: 2.5.1
      TYPESCRIPT_VERSION: 6.0.3
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Lint and format-check JS/TS
        # Scope at authored runtime surfaces and the conforming fixture. Bad
        # fixtures are non-conforming by design; node_modules and locks are
        # excluded by Biome's normal traversal rules.
        if: ${{ !cancelled() }}
        uses: melodic-software/ci-workflows/.github/actions/biome@ab83b01273026ab5c23c6f3b40e946d97a863fa2 # v0.39.3
        with:
          config: components/biome/biome.json
          paths: components/biome/fixtures/good components/concurrency-policy components/dependabot-policy components/github-actions-conventions components/mcp-launcher components/runner-policy distribution harness/packages
      - name: Set up Node
        if: ${{ !cancelled() }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      # Each supported TypeScript release in turn, installed on PATH so the
      # packed tsconfig contract test drives that exact tsc.
      - name: Test packed tsconfig contract on TypeScript 5.9.3
