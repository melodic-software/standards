name: pr-require-checks

on:
  push:
    branches: [main]
  pull_request:
    # `edited`, `labeled` and `unlabeled` can change the pr-title,
    # do-not-merge and issue-linkage answers without a new commit, so the
    # required check has to re-evaluate. Whether such an event is
    # CONTRACT-ONLY (lanes gated off, ci-status carrying the recorded
    # `ci-lanes` verdict forward) is decided by one predicate, repeated
    # verbatim in `concurrency.group` and in every job's `if:` except
    # `ci-status`:
    #
    #   github.event.pull_request.head.repo.full_name == github.repository &&
    #   (contains(fromJSON('["labeled","unlabeled"]'), github.event.action) ||
    #    (github.event.action == 'edited' && !github.event.changes.base))
    #
    # An `edited` event carrying `changes.base` is a BASE-BRANCH change: the
    # merge commit the lanes test changes with it, so that runs in full. A
    # fork pull request is never contract-only — its token is read-only on
    # `pull_request` whatever `permissions:` requests, so it cannot record
    # lane state — and runs the full workflow on every event exactly as
    # before. No `ready_for_review`: this workflow is not draft-gated.
    types: [opened, synchronize, reopened, edited, labeled, unlabeled]

permissions:
  contents: read

# The concurrency GROUP branches on the contract-only predicate (ci-perf Phase
# 6b); `cancel-in-progress` is a plain `true` because it takes one value per
# workflow and cannot branch.
#
# Contract-only branch: `ci-contract-<pr>-<run_id>`, unique per run. No
# contract-only run can be canceled, evict anything, or be evicted. That is
# deliberate. Eviction of a *pending* run is unconditional in GitHub's queuing
# ("any existing pending job or workflow in the same concurrency group will be
# canceled") and is NOT governed by `cancel-in-progress`, so the old shared
# group let one contract-only event evict another and leave a check suite on the
# current head with no `ci-status` check run at all, a required check that stops
# reporting until someone re-runs that specific run (dotfiles#647, 2h14m
# silent). Uniqueness costs a burst of one-job runs when labels flip repeatedly,
# seconds each, writing nothing.
#
# Full branch: `<workflow>-<pr number || run_id>` with cancel-in-progress true,
# so a `synchronize` still cancels the run it supersedes. Keying PRs on the
# number (not head_ref) keeps fork PRs that share a branch name from canceling
# each other's required runs. The fallback term stays `github.run_id`, which
# this repository has always used: every push gets its own group and no push run
# is ever canceled.
#
# The cost of the branch: a contract-only run no longer queues behind the full
# run whose `ci-lanes` status it carries forward, so the two race. The
# `ci-status` composite closes that with a bounded wait on EARLIER incomplete
# runs on the same head SHA; see `carry-forward-wait-seconds` on the job below.
#
# One hazard the branch does not remove, because no concurrency setting both
# removes it and keeps supersession: the full branch is keyed on the pull
# request number, which does not vary with the head SHA, so re-running a STALE
# run on a superseded head SHA lands in the CURRENT head's group and cancels the
# run that is actually reporting. Re-run the run on the current head instead.
# Contract-only runs are immune, being unique per `github.run_id`.
concurrency:
  group: >-
    ${{ (github.event.pull_request.head.repo.full_name == github.repository &&
    (contains(fromJSON('["labeled","unlabeled"]'), github.event.action) ||
    (github.event.action == 'edited' && !github.event.changes.base)))
    && format('ci-contract-{0}-{1}', github.event.pull_request.number, github.run_id)
    || format('{0}-{1}', github.workflow, github.event.pull_request.number || github.run_id) }}
  cancel-in-progress: true

# Public repository: every lane runs on GitHub-hosted ubuntu-24.04 (free for
# public repositories); a managed fleet label is not permitted here. The
# ci-status gateway aggregates the same lane IDs, so required check names do
# not change. Workload steps are route-independent: pinned setup/composite
# actions install every tool, and setup-action caches are GitHub-managed.
jobs:
  # Every job except `ci-status` carries the contract-only gate verbatim. It is
  # explicit on each one rather than transitive: a dependent whose `needs` all
  # skipped is skipped by default, but a job with `if: always()` or
  # `!cancelled()` runs regardless, so only the explicit form is reliable.
  #
  # One job per ecosystem or domain. Most checks here finish in seconds, so a
  # job per check spent more time on runner start, checkout and setup than on
  # the check, and held a runner slot for each. Every step after checkout runs
  # `if: !cancelled()`, so one failing check does not hide the ones after it
  # in the same job. check-go is the exception: its steps are one chain (set
  # up Go, install golangci-lint, test), so they keep the default success().
  #
  # The slow jobs (test-lefthook, check-python, check-dotnet, check-go) start
  # with ci-workflows detect-changes and gate every later step on their filter
  # group, so a pull request that touches none of a job's inputs runs only the
  # detection step and the job still reports success to ci-status. On push and
  # on any other non-pull_request event the action reports every group as
  # changed, so main always runs everything. Gating is per step, not per job:
  # a skipped job fails ci-status (`treat-skipped-as: fail`).
  check-shell:
    if: ${{ !(github.event.pull_request.head.repo.full_name == github.repository && (contains(fromJSON('["labeled","unlabeled"]'), github.event.action) || (github.event.action == 'edited' && !github.event.changes.base))) }}
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Lint shell
        if: ${{ !cancelled() }}
        uses: melodic-software/ci-workflows/.github/actions/shellcheck@ab83b01273026ab5c23c6f3b40e946d97a863fa2 # v0.39.3
        with:
          rcfile: .shellcheckrc
          exclude: components/shellcheck/fixtures/bad
      - name: Install ShellCheck 0.11.0
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          ver=0.11.0
          sha=b7af85e41cc99489dcc21d66c6d5f3685138f06d34651e6d34b42ec6d54fe6f6
          url="https://github.com/koalaman/shellcheck/releases/download/v${ver}/shellcheck-v${ver}.linux.x86_64.tar.gz"
          curl -fsSL "$url" -o shellcheck.tar.gz
          echo "${sha}  shellcheck.tar.gz" | sha256sum -c -
          tar -xzf shellcheck.tar.gz "shellcheck-v${ver}/shellcheck"
          sudo install "shellcheck-v${ver}/shellcheck" /usr/local/bin/shellcheck
          rm -rf shellcheck.tar.gz "shellcheck-v${ver}"
          shellcheck --version
      - name: ShellCheck contract test
        if: ${{ !cancelled() }}
        run: bash harness/shell/run-tests.sh components/shellcheck/shellcheck.test.sh
      - name: Harness self-test
        if: ${{ !cancelled() }}
        run: bash harness/shell/run-tests.sh harness/shell/lib.test.sh
      - name: Local-lane-guards contract test
        if: ${{ !cancelled() }}
        run: bash harness/shell/run-tests.sh components/local-lane-guards/local-lane-guards.test.sh

  check-markdown-and-links:
    if: ${{ !(github.event.pull_request.head.repo.full_name == github.repository && (contains(fromJSON('["labeled","unlabeled"]'), github.event.action) || (github.event.action == 'edited' && !github.event.changes.base))) }}
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Before Set up Node: the markdownlint action installs its own Node, and
      # the contract tests below run on the repository's .node-version.
      - name: Lint markdown
        if: ${{ !cancelled() }}
        uses: melodic-software/ci-workflows/.github/actions/markdownlint@ab83b01273026ab5c23c6f3b40e946d97a863fa2 # v0.39.3
        with:
          config: .markdownlint-cli2.jsonc
          globs: '**/*.md !components/**/fixtures/bad/**'
      - name: Set up Node
        if: ${{ !cancelled() }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install pinned dependencies
        if: ${{ !cancelled() }}
        run: npm ci
      - name: Markdownlint contract test
        if: ${{ !cancelled() }}
        run: bash harness/shell/run-tests.sh components/markdownlint/markdownlint.test.sh
      - name: Markdownlint home contract test
        if: ${{ !cancelled() }}
        run: bash harness/shell/run-tests.sh components/markdownlint/markdownlint-home.test.sh
      - name: Markdownlint schema-pin contract test
        if: ${{ !cancelled() }}
        run: bash harness/shell/run-tests.sh components/markdownlint/markdownlint-schema-pin.test.sh
      - name: Check links (offline)
        if: ${{ !cancelled() }}
        uses: melodic-software/ci-workflows/.github/actions/lychee-offline@ab83b01273026ab5c23c6f3b40e946d97a863fa2 # v0.39.3
        with:
          config: lychee.toml
          exclude: 'components/[^/]+/fixtures/bad'
      - name: Install lychee 0.24.2
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          ver=0.24.2
          sha=1f4e0ef7f6554a6ed33dd7ac144fb2e1bbed98598e7af973042fc5cd43951c9a
          asset=lychee-x86_64-unknown-linux-gnu
          url="https://github.com/lycheeverse/lychee/releases/download/lychee-v${ver}/${asset}.tar.gz"
          curl -fsSL "$url" -o lychee.tar.gz
          echo "${sha}  lychee.tar.gz" | sha256sum -c -
          tar -xzf lychee.tar.gz --strip-components=1 "${asset}/lychee"
          sudo install lychee /usr/local/bin/lychee
          rm -f lychee.tar.gz lychee
          lychee --version
      - name: Lychee contract test
        if: ${{ !cancelled() }}
        run: bash harness/shell/run-tests.sh components/lychee/lychee.test.sh
      - name: Private-repo inventory contract test
        if: ${{ !cancelled() }}
        run: bash harness/shell/run-tests.sh components/lychee/private-repo-inventory.test.sh
      # The credential-free half of the inventory check: a public repository's
      # token lists the org's public repositories, so an excluded repository
      # that went public fails here, and the two alternations are held sorted
      # and identical. The other direction (a new private repository missing
      # from the list) needs the App installation's view and runs in the
      # scheduled maintenance-audit-link-check-excludes workflow.
      - name: Private-repo inventory agrees with public visibility
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash components/lychee/private-repo-inventory.sh check --config lychee.toml

  check-repo-hygiene:
    if: ${{ !(github.event.pull_request.head.repo.full_name == github.repository && (contains(fromJSON('["labeled","unlabeled"]'), github.event.action) || (github.event.action == 'edited' && !github.event.changes.base))) }}
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Self-lint repository (installs ec, excludes intentionally-bad fixtures)
        if: ${{ !cancelled() }}
        uses: melodic-software/ci-workflows/.github/actions/editorconfig-checker@ab83b01273026ab5c23c6f3b40e946d97a863fa2 # v0.39.3
        with:
          config: .editorconfig-checker.json
          exclude: 'components/[^/]+/fixtures/bad/'
      - name: EditorConfig checker contract test
        if: ${{ !cancelled() }}
        run: bash harness/shell/run-tests.sh components/editorconfig-checker/editorconfig-checker.test.sh
      - name: Scan repository for secrets (installs gitleaks)
        if: ${{ !cancelled() }}
        uses: melodic-software/ci-workflows/.github/actions/gitleaks@ab83b01273026ab5c23c6f3b40e946d97a863fa2 # v0.39.3
        with:
          config: .gitleaks.toml
      - name: Gitleaks contract test
        if: ${{ !cancelled() }}
        run: bash harness/shell/run-tests.sh components/gitleaks/gitleaks.test.sh
      - name: Spell-check repository (installs typos, excludes intentionally-bad fixtures)
        if: ${{ !cancelled() }}
        uses: melodic-software/ci-workflows/.github/actions/typos@ab83b01273026ab5c23c6f3b40e946d97a863fa2 # v0.39.3
        with:
          config: _typos.toml
          exclude: 'components/*/fixtures/bad/'
      - name: Typos contract test
        if: ${{ !cancelled() }}
        run: bash harness/shell/run-tests.sh components/typos/typos.test.sh
      - name: Verify shebang files are executable
        if: ${{ !cancelled() }}
        uses: melodic-software/ci-workflows/.github/actions/check-exec-bit@ab83b01273026ab5c23c6f3b40e946d97a863fa2 # v0.39.3
      - name: Check for machine-specific paths (excludes the pattern source, which self-matches)
        if: ${{ !cancelled() }}
        uses: melodic-software/ci-workflows/.github/actions/check-machine-paths@ab83b01273026ab5c23c6f3b40e946d97a863fa2 # v0.39.3
        with:
          exclude: ':(exclude)components/path-detection/**'
      - name: Path-detection contract test
        if: ${{ !cancelled() }}
        run: bash harness/shell/run-tests.sh components/path-detection/machine-path-patterns.test.sh
      - name: Check index-level EOL drift
        if: ${{ !cancelled() }}
        uses: melodic-software/ci-workflows/.github/actions/check-line-endings@ab83b01273026ab5c23c6f3b40e946d97a863fa2 # v0.39.3
      - name: Scan comment hygiene (excludes contract fixtures and policy source)
        if: ${{ !cancelled() }}
        uses: melodic-software/ci-workflows/.github/actions/check-comment-markers@ab83b01273026ab5c23c6f3b40e946d97a863fa2 # v0.39.3
        with:
          exclude: ':(exclude)components/*/fixtures/bad/** :(exclude)components/comment-hygiene/**'
      - name: Comment-hygiene contract test
        if: ${{ !cancelled() }}
        run: bash harness/shell/run-tests.sh components/comment-hygiene/comment-hygiene.test.sh
      # The pull-request half of the Code Review Rules check: this repository's
      # own AGENTS.md. Other repositories are checked by the scheduled
      # maintenance-audit-code-review-rules workflow.
      - name: Code Review Rules contract test
        if: ${{ !cancelled() }}
        run: bash harness/shell/run-tests.sh components/code-review-rules/code-review-rules.test.sh
      - name: This repository's AGENTS.md carries the section
        if: ${{ !cancelled() }}
        run: bash components/code-review-rules/code-review-rules.sh file

  check-powershell:
    if: ${{ !(github.event.pull_request.head.repo.full_name == github.repository && (contains(fromJSON('["labeled","unlabeled"]'), github.event.action) || (github.event.action == 'edited' && !github.event.changes.base))) }}
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Analyze PowerShell
        if: ${{ !cancelled() }}
        uses: melodic-software/ci-workflows/.github/actions/psscriptanalyzer@ab83b01273026ab5c23c6f3b40e946d97a863fa2 # v0.39.3
        with:
          settings: PSScriptAnalyzerSettings.psd1
          exclude: components/psscriptanalyzer/fixtures/bad
      - name: Ensure PSScriptAnalyzer 1.25.0
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          $required = '1.25.0'
          $have = Get-Module -ListAvailable PSScriptAnalyzer |
              Where-Object { $_.Version -eq [version]$required }
          if (-not $have) {
              try {
                  Install-Module PSScriptAnalyzer -RequiredVersion $required -Scope CurrentUser -Force -SkipPublisherCheck -ErrorAction Stop
              } catch {
                  Install-PSResource PSScriptAnalyzer -Version $required -Scope CurrentUser -TrustRepository -Reinstall -ErrorAction Stop
              }
          }
          Import-Module PSScriptAnalyzer -RequiredVersion $required -ErrorAction Stop
          Write-Output "PSScriptAnalyzer $((Get-Module PSScriptAnalyzer).Version) on pwsh $($PSVersionTable.PSVersion)"
      - name: PSScriptAnalyzer contract test
        if: ${{ !cancelled() }}
        run: bash harness/shell/run-tests.sh components/psscriptanalyzer/psscriptanalyzer.test.sh

  # Holds the PowerShell staged-adapter regression, the slowest step in this
  # workflow (about 70 s); it stays out of check-powershell so neither job
  # becomes the sum of both.
  test-lefthook:
    if: ${{ !(github.event.pull_request.head.repo.full_name == github.repository && (contains(fromJSON('["labeled","unlabeled"]'), github.event.action) || (github.event.action == 'edited' && !github.event.changes.base))) }}
    permissions:
      contents: read
      pull-requests: read
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Detect relevant changes
        id: changes
        uses: melodic-software/ci-workflows/.github/actions/detect-changes@ab83b01273026ab5c23c6f3b40e946d97a863fa2 # v0.39.3
        with:
          filters: |
            lefthook:
              .github/workflows/pr-require-checks.yml
              harness/shell/**
              .node-version
              package.json
              package-lock.json
              lefthook.yml
              .lefthook/**
              components/lefthook-*/**
              PSScriptAnalyzerSettings.psd1
              .shellcheckrc
      - name: Check out
        if: ${{ fromJSON(steps.changes.outputs.results || '{}')['lefthook'] != 'false' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node
        if: ${{ !cancelled() && fromJSON(steps.changes.outputs.results || '{}')['lefthook'] != 'false' }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install pinned dependencies
        if: ${{ !cancelled() && fromJSON(steps.changes.outputs.results || '{}')['lefthook'] != 'false' }}
        run: npm ci
      - name: Put npm bin on PATH
        if: ${{ !cancelled() && fromJSON(steps.changes.outputs.results || '{}')['lefthook'] != 'false' }}
        run: echo "$PWD/node_modules/.bin" >> "$GITHUB_PATH"
      - name: Install ShellCheck 0.11.0
        # The component test drives the ShellCheck lane as its representative tool,
        # so the engine must be on PATH (kept in lockstep with check-shell).
        if: ${{ !cancelled() && fromJSON(steps.changes.outputs.results || '{}')['lefthook'] != 'false' }}
        run: |
          set -euo pipefail
          ver=0.11.0
          sha=b7af85e41cc99489dcc21d66c6d5f3685138f06d34651e6d34b42ec6d54fe6f6
          url="https://github.com/koalaman/shellcheck/releases/download/v${ver}/shellcheck-v${ver}.linux.x86_64.tar.gz"
          curl -fsSL "$url" -o shellcheck.tar.gz
          echo "${sha}  shellcheck.tar.gz" | sha256sum -c -
          tar -xzf shellcheck.tar.gz "shellcheck-v${ver}/shellcheck"
          sudo install "shellcheck-v${ver}/shellcheck" /usr/local/bin/shellcheck
          rm -rf shellcheck.tar.gz "shellcheck-v${ver}"
          shellcheck --version
      - name: Validate the merged hook config (root + all fragments)
        if: ${{ !cancelled() && fromJSON(steps.changes.outputs.results || '{}')['lefthook'] != 'false' }}
        run: lefthook validate
      - name: Lefthook base contract test
        if: ${{ !cancelled() && fromJSON(steps.changes.outputs.results || '{}')['lefthook'] != 'false' }}
        run: bash harness/shell/run-tests.sh components/lefthook-base/lefthook-base.test.sh
      - name: Lefthook merge/rebase skip placement test
        if: ${{ !cancelled() && fromJSON(steps.changes.outputs.results || '{}')['lefthook'] != 'false' }}
        run: bash harness/shell/run-tests.sh components/lefthook-base/lefthook-merge-skip.test.sh
      - name: Lefthook ShellCheck contract test
        if: ${{ !cancelled() && fromJSON(steps.changes.outputs.results || '{}')['lefthook'] != 'false' }}
        run: bash harness/shell/run-tests.sh components/lefthook-shellcheck/lefthook-shellcheck.test.sh
      - name: Test .NET staged adapter
        if: ${{ !cancelled() && fromJSON(steps.changes.outputs.results || '{}')['lefthook'] != 'false' }}
        run: npm run test:lefthook-dotnet
      - name: Ensure PSScriptAnalyzer 1.25.0
        if: ${{ !cancelled() && fromJSON(steps.changes.outputs.results || '{}')['lefthook'] != 'false' }}
        shell: pwsh
        run: |
          $required = '1.25.0'
          $have = Get-Module -ListAvailable PSScriptAnalyzer |
              Where-Object { $_.Version -eq [version]$required }
          if (-not $have) {
              try {
                  Install-Module PSScriptAnalyzer -RequiredVersion $required -Scope CurrentUser -Force -SkipPublisherCheck -ErrorAction Stop
              } catch {
                  Install-PSResource PSScriptAnalyzer -Version $required -Scope CurrentUser -TrustRepository -Reinstall -ErrorAction Stop
              }
          }
          Import-Module PSScriptAnalyzer -RequiredVersion $required -ErrorAction Stop
          Write-Output "PSScriptAnalyzer $((Get-Module PSScriptAnalyzer).Version) on pwsh $($PSVersionTable.PSVersion)"
      - name: PSScriptAnalyzer staged-adapter regression
        if: ${{ !cancelled() && fromJSON(steps.changes.outputs.results || '{}')['lefthook'] != 'false' }}
        shell: pwsh
        run: ./components/lefthook-powershell/psscriptanalyzer-staged.test.ps1

  check-python:
    if: ${{ !(github.event.pull_request.head.repo.full_name == github.repository && (contains(fromJSON('["labeled","unlabeled"]'), github.event.action) || (github.event.action == 'edited' && !github.event.changes.base))) }}
    permissions:
      contents: read
      pull-requests: read
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      # Inline install — component contract tests assert specific rule codes on
      # bad fixtures, which needs the tools on PATH (the Ruff/Pyright actions
      # only pass/fail). Keep in lockstep with the action defaults in ci-workflows
      # and with medley.
      RUFF_VERSION: 0.15.14
      PYRIGHT_VERSION: 1.1.409
    steps:
      - name: Detect relevant changes
        id: changes
        uses: melodic-software/ci-workflows/.github/actions/detect-changes@ab83b01273026ab5c23c6f3b40e946d97a863fa2 # v0.39.3
        with:
          filters: |
            python:
              .github/workflows/pr-require-checks.yml
              harness/shell/**
              ruff.toml
              .gitignore
              .gitattributes
              components/ruff/**
              components/pyright/**
              **/*.py
              **/*.pyi
              **/*.ipynb
              **/pyproject.toml
              **/pyrightconfig.json
      - name: Check out
        if: ${{ fromJSON(steps.changes.outputs.results || '{}')['python'] != 'false' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The two actions run before the inline install so the contract tests
      # find the inline-installed tools first on PATH.
      - name: Lint and format-check Python
        if: ${{ !cancelled() && fromJSON(steps.changes.outputs.results || '{}')['python'] != 'false' }}
        uses: melodic-software/ci-workflows/.github/actions/ruff@ab83b01273026ab5c23c6f3b40e946d97a863fa2 # v0.39.3
        with:
          config: ruff.toml
          exclude: components/ruff/fixtures/bad
      - name: Type-check Python
        # The shipped ruleset carries no project-scope `include`, so scope Pyright
        # at the conforming fixture explicitly (the bad fixture is non-conforming
        # by design).
        if: ${{ !cancelled() && fromJSON(steps.changes.outputs.results || '{}')['python'] != 'false' }}
        uses: melodic-software/ci-workflows/.github/actions/pyright@ab83b01273026ab5c23c6f3b40e946d97a863fa2 # v0.39.3
        with:
          config: components/pyright/pyrightconfig.json
          paths: components/pyright/fixtures/good
      - name: Set up uv
