name: PR Require Checks

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, edited, labeled, unlabeled]

permissions:
  contents: read

# A new run cancels any pending run in its group whatever `cancel-in-progress` says:
# https://docs.github.com/en/actions/how-tos/write-workflows/choose-when-workflows-run/control-workflow-concurrency
concurrency:
  group: >-
    ${{ (github.event.pull_request.head.repo.full_name == github.repository &&
    (contains(fromJSON('["labeled","unlabeled"]'), github.event.action) ||
    (github.event.action == 'edited' && !github.event.changes.base)))
    && format('ci-contract-{0}-{1}', github.event.pull_request.number, github.run_id)
    || format('{0}-{1}', github.workflow, github.event.pull_request.number || github.run_id) }}
  cancel-in-progress: true

jobs:
  # Each job repeats the gate: a skipped `needs` does not skip an `always()` job:
  # https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-syntax#jobsjob_idneeds
  check-shell:
    name: Check Shell
    if: ${{ !(github.event.pull_request.head.repo.full_name == github.repository && (contains(fromJSON('["labeled","unlabeled"]'), github.event.action) || (github.event.action == 'edited' && !github.event.changes.base))) }}
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Lint shell
        if: ${{ !cancelled() }}
        uses: melodic-software/ci-workflows/.github/actions/shellcheck@main
        with:
          rcfile: .shellcheckrc
          exclude: components/shellcheck/fixtures/bad
      - name: Install ShellCheck 0.11.0
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          ver=0.11.0
          sha=b7af85e41cc99489dcc21d66c6d5f3685138f06d34651e6d34b42ec6d54fe6f6
          url="https://github.com/koalaman/shellcheck/releases/download/v${ver}/shellcheck-v${ver}.linux.x86_64.tar.gz"
          curl -fsSL "$url" -o shellcheck.tar.gz
          echo "${sha}  shellcheck.tar.gz" | sha256sum -c -
          tar -xzf shellcheck.tar.gz "shellcheck-v${ver}/shellcheck"
          sudo install "shellcheck-v${ver}/shellcheck" /usr/local/bin/shellcheck
          rm -rf shellcheck.tar.gz "shellcheck-v${ver}"
          shellcheck --version
      - name: ShellCheck contract test
        if: ${{ !cancelled() }}
        run: bash harness/shell/run-tests.sh components/shellcheck/shellcheck.test.sh
      - name: Harness self-test
        if: ${{ !cancelled() }}
        run: bash harness/shell/run-tests.sh harness/shell/lib.test.sh

  check-markdown-and-links:
    name: Check Markdown And Links
    if: ${{ !(github.event.pull_request.head.repo.full_name == github.repository && (contains(fromJSON('["labeled","unlabeled"]'), github.event.action) || (github.event.action == 'edited' && !github.event.changes.base))) }}
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Lint markdown
        if: ${{ !cancelled() }}
        uses: melodic-software/ci-workflows/.github/actions/markdownlint@main
        with:
          config: .markdownlint-cli2.jsonc
          globs: '**/*.md !components/**/fixtures/bad/**'
      - name: Set up Node
        if: ${{ !cancelled() }}
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install pinned dependencies
        if: ${{ !cancelled() }}
        run: npm ci
      - name: Markdownlint contract test
        if: ${{ !cancelled() }}
        run: bash harness/shell/run-tests.sh components/markdownlint/markdownlint.test.sh
      - name: Markdownlint home contract test
        if: ${{ !cancelled() }}
        run: bash harness/shell/run-tests.sh components/markdownlint/markdownlint-home.test.sh
      - name: Check links (offline)
        if: ${{ !cancelled() }}
        uses: melodic-software/ci-workflows/.github/actions/lychee-offline@main
        with:
          config: lychee.toml
          exclude: 'components/[^/]+/fixtures/bad'
      - name: Install lychee 0.24.2
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          ver=0.24.2
          sha=1f4e0ef7f6554a6ed33dd7ac144fb2e1bbed98598e7af973042fc5cd43951c9a
          asset=lychee-x86_64-unknown-linux-gnu
          url="https://github.com/lycheeverse/lychee/releases/download/lychee-v${ver}/${asset}.tar.gz"
          curl -fsSL "$url" -o lychee.tar.gz
          echo "${sha}  lychee.tar.gz" | sha256sum -c -
          tar -xzf lychee.tar.gz --strip-components=1 "${asset}/lychee"
          sudo install lychee /usr/local/bin/lychee
          rm -f lychee.tar.gz lychee
          lychee --version
      - name: Lychee contract test
        if: ${{ !cancelled() }}
        run: bash harness/shell/run-tests.sh components/lychee/lychee.test.sh
      - name: Private-repo inventory contract test
        if: ${{ !cancelled() }}
        run: bash harness/shell/run-tests.sh components/lychee/private-repo-inventory.test.sh
      - name: Private-repo inventory agrees with public visibility
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash components/lychee/private-repo-inventory.sh check --config lychee.toml

  check-repo-hygiene:
    name: Check Repo Hygiene
    if: ${{ !(github.event.pull_request.head.repo.full_name == github.repository && (contains(fromJSON('["labeled","unlabeled"]'), github.event.action) || (github.event.action == 'edited' && !github.event.changes.base))) }}
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Self-lint repository (installs ec, excludes intentionally-bad fixtures)
        if: ${{ !cancelled() }}
        uses: melodic-software/ci-workflows/.github/actions/editorconfig-checker@main
        with:
          config: .editorconfig-checker.json
          exclude: 'components/[^/]+/fixtures/bad/'
      - name: EditorConfig checker contract test
        if: ${{ !cancelled() }}
        run: bash harness/shell/run-tests.sh components/editorconfig-checker/editorconfig-checker.test.sh
      - name: Scan repository for secrets (installs gitleaks)
        if: ${{ !cancelled() }}
        uses: melodic-software/ci-workflows/.github/actions/gitleaks@main
        with:
          config: .gitleaks.toml
      - name: Gitleaks contract test
        if: ${{ !cancelled() }}
        run: bash harness/shell/run-tests.sh components/gitleaks/gitleaks.test.sh
      - name: Spell-check repository (installs typos, excludes intentionally-bad fixtures)
        if: ${{ !cancelled() }}
        uses: melodic-software/ci-workflows/.github/actions/typos@main
        with:
          config: _typos.toml
          exclude: 'components/*/fixtures/bad/'
      - name: Typos contract test
        if: ${{ !cancelled() }}
        run: bash harness/shell/run-tests.sh components/typos/typos.test.sh
      - name: Verify shebang files are executable
        if: ${{ !cancelled() }}
        uses: melodic-software/ci-workflows/.github/actions/check-exec-bit@main
      - name: Check for machine-specific paths (excludes the pattern sources, which self-match)
        if: ${{ !cancelled() }}
        uses: melodic-software/ci-workflows/.github/actions/check-machine-paths@main
        with:
          exclude: ':(exclude)components/path-detection/**'
      - name: Path-detection contract test
        if: ${{ !cancelled() }}
        run: bash harness/shell/run-tests.sh components/path-detection/machine-path-patterns.test.sh
      - name: Check index-level EOL drift
        if: ${{ !cancelled() }}
        uses: melodic-software/ci-workflows/.github/actions/check-line-endings@main
      - name: Scan comment hygiene (excludes contract fixtures and policy source)
        if: ${{ !cancelled() }}
        uses: melodic-software/ci-workflows/.github/actions/check-comment-markers@main
        with:
          exclude: ':(exclude)components/*/fixtures/bad/** :(exclude)components/comment-hygiene/**'
      - name: Comment-hygiene contract test
        if: ${{ !cancelled() }}
        run: bash harness/shell/run-tests.sh components/comment-hygiene/comment-hygiene.test.sh
      - name: Test the `Code Review Rules` contract
        if: ${{ !cancelled() }}
        run: bash harness/shell/run-tests.sh components/code-review-rules/code-review-rules.test.sh
      - name: This repository's AGENTS.md carries the section
        if: ${{ !cancelled() }}
        run: bash components/code-review-rules/code-review-rules.sh file

  check-powershell:
    name: Check PowerShell
    if: ${{ !(github.event.pull_request.head.repo.full_name == github.repository && (contains(fromJSON('["labeled","unlabeled"]'), github.event.action) || (github.event.action == 'edited' && !github.event.changes.base))) }}
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Analyze PowerShell
        if: ${{ !cancelled() }}
        uses: melodic-software/ci-workflows/.github/actions/psscriptanalyzer@main
        with:
          settings: PSScriptAnalyzerSettings.psd1
          exclude: components/psscriptanalyzer/fixtures/bad
      - name: Ensure PSScriptAnalyzer 1.25.0
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          $required = '1.25.0'
          $have = Get-Module -ListAvailable PSScriptAnalyzer |
              Where-Object { $_.Version -eq [version]$required }
          if (-not $have) {
              try {
                  Install-Module PSScriptAnalyzer -RequiredVersion $required -Scope CurrentUser -Force -SkipPublisherCheck -ErrorAction Stop
              } catch {
                  Install-PSResource PSScriptAnalyzer -Version $required -Scope CurrentUser -TrustRepository -Reinstall -ErrorAction Stop
              }
          }
          Import-Module PSScriptAnalyzer -RequiredVersion $required -ErrorAction Stop
          Write-Output "PSScriptAnalyzer $((Get-Module PSScriptAnalyzer).Version) on pwsh $($PSVersionTable.PSVersion)"
      - name: PSScriptAnalyzer contract test
        if: ${{ !cancelled() }}
        run: bash harness/shell/run-tests.sh components/psscriptanalyzer/psscriptanalyzer.test.sh

  test-lefthook:
    name: Test Lefthook
    if: ${{ !(github.event.pull_request.head.repo.full_name == github.repository && (contains(fromJSON('["labeled","unlabeled"]'), github.event.action) || (github.event.action == 'edited' && !github.event.changes.base))) }}
    permissions:
      contents: read
      pull-requests: read
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Detect relevant changes
        id: changes
        uses: melodic-software/ci-workflows/.github/actions/detect-changes@main
        with:
          filters: |
            lefthook:
              .github/workflows/pr-require-checks.yml
              harness/shell/**
              .node-version
              package.json
              package-lock.json
              lefthook.yml
              .lefthook/**
              components/lefthook-*/**
              PSScriptAnalyzerSettings.psd1
              .shellcheckrc
      - name: Check out
        if: ${{ fromJSON(steps.changes.outputs.results || '{}')['lefthook'] != 'false' }}
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Node
        if: ${{ !cancelled() && fromJSON(steps.changes.outputs.results || '{}')['lefthook'] != 'false' }}
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install pinned dependencies
        if: ${{ !cancelled() && fromJSON(steps.changes.outputs.results || '{}')['lefthook'] != 'false' }}
        run: npm ci
      - name: Put npm bin on PATH
        if: ${{ !cancelled() && fromJSON(steps.changes.outputs.results || '{}')['lefthook'] != 'false' }}
        run: echo "$PWD/node_modules/.bin" >> "$GITHUB_PATH"
      - name: Install ShellCheck 0.11.0
        if: ${{ !cancelled() && fromJSON(steps.changes.outputs.results || '{}')['lefthook'] != 'false' }}
        run: |
          set -euo pipefail
          ver=0.11.0
          sha=b7af85e41cc99489dcc21d66c6d5f3685138f06d34651e6d34b42ec6d54fe6f6
          url="https://github.com/koalaman/shellcheck/releases/download/v${ver}/shellcheck-v${ver}.linux.x86_64.tar.gz"
          curl -fsSL "$url" -o shellcheck.tar.gz
          echo "${sha}  shellcheck.tar.gz" | sha256sum -c -
          tar -xzf shellcheck.tar.gz "shellcheck-v${ver}/shellcheck"
          sudo install "shellcheck-v${ver}/shellcheck" /usr/local/bin/shellcheck
          rm -rf shellcheck.tar.gz "shellcheck-v${ver}"
          shellcheck --version
      - name: Validate the root hook config
        if: ${{ !cancelled() && fromJSON(steps.changes.outputs.results || '{}')['lefthook'] != 'false' }}
        run: lefthook validate
      - name: Validate each lefthook component fragment
        if: ${{ !cancelled() && fromJSON(steps.changes.outputs.results || '{}')['lefthook'] != 'false' }}
        run: bash harness/shell/run-tests.sh components/lefthook-base/lefthook-fragments-validate.test.sh
      - name: Lefthook base contract test
        if: ${{ !cancelled() && fromJSON(steps.changes.outputs.results || '{}')['lefthook'] != 'false' }}
        run: bash harness/shell/run-tests.sh components/lefthook-base/lefthook-base.test.sh
      - name: Lefthook remote contract test
        if: ${{ !cancelled() && fromJSON(steps.changes.outputs.results || '{}')['lefthook'] != 'false' }}
        run: bash harness/shell/run-tests.sh components/lefthook-base/lefthook-remote.test.sh
      - name: Lefthook merge/rebase skip placement test
        if: ${{ !cancelled() && fromJSON(steps.changes.outputs.results || '{}')['lefthook'] != 'false' }}
        run: bash harness/shell/run-tests.sh components/lefthook-base/lefthook-merge-skip.test.sh
      - name: Lefthook adapter root-glob test
        if: ${{ !cancelled() && fromJSON(steps.changes.outputs.results || '{}')['lefthook'] != 'false' }}
        run: bash harness/shell/run-tests.sh components/lefthook-base/lefthook-adapter-globs.test.sh
      - name: Lefthook ShellCheck contract test
        if: ${{ !cancelled() && fromJSON(steps.changes.outputs.results || '{}')['lefthook'] != 'false' }}
        run: bash harness/shell/run-tests.sh components/lefthook-shellcheck/lefthook-shellcheck.test.sh
      - name: Lefthook TypeScript contract test
        if: ${{ !cancelled() && fromJSON(steps.changes.outputs.results || '{}')['lefthook'] != 'false' }}
        run: bash harness/shell/run-tests.sh components/lefthook-typescript/lefthook-typescript.test.sh
      - name: Test .NET staged adapter
        if: ${{ !cancelled() && fromJSON(steps.changes.outputs.results || '{}')['lefthook'] != 'false' }}
        run: npm run test:lefthook-dotnet
      - name: Ensure PSScriptAnalyzer 1.25.0
        if: ${{ !cancelled() && fromJSON(steps.changes.outputs.results || '{}')['lefthook'] != 'false' }}
        shell: pwsh
        run: |
          $required = '1.25.0'
          $have = Get-Module -ListAvailable PSScriptAnalyzer |
              Where-Object { $_.Version -eq [version]$required }
          if (-not $have) {
              try {
                  Install-Module PSScriptAnalyzer -RequiredVersion $required -Scope CurrentUser -Force -SkipPublisherCheck -ErrorAction Stop
              } catch {
                  Install-PSResource PSScriptAnalyzer -Version $required -Scope CurrentUser -TrustRepository -Reinstall -ErrorAction Stop
              }
          }
          Import-Module PSScriptAnalyzer -RequiredVersion $required -ErrorAction Stop
          Write-Output "PSScriptAnalyzer $((Get-Module PSScriptAnalyzer).Version) on pwsh $($PSVersionTable.PSVersion)"
      - name: PSScriptAnalyzer staged-adapter regression
        if: ${{ !cancelled() && fromJSON(steps.changes.outputs.results || '{}')['lefthook'] != 'false' }}
        shell: pwsh
        run: ./components/lefthook-powershell/psscriptanalyzer-staged.test.ps1

  check-python:
    name: Check Python
    if: ${{ !(github.event.pull_request.head.repo.full_name == github.repository && (contains(fromJSON('["labeled","unlabeled"]'), github.event.action) || (github.event.action == 'edited' && !github.event.changes.base))) }}
    permissions:
      contents: read
      pull-requests: read
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      RUFF_VERSION: 0.15.14
    steps:
      - name: Detect relevant changes
        id: changes
        uses: melodic-software/ci-workflows/.github/actions/detect-changes@main
        with:
          filters: |
            python:
              .github/workflows/pr-require-checks.yml
              harness/shell/**
              ruff.toml
              .gitignore
              .gitattributes
              components/ruff/**
              **/*.py
              **/*.pyi
              **/*.ipynb
              **/pyproject.toml
      - name: Check out
        if: ${{ fromJSON(steps.changes.outputs.results || '{}')['python'] != 'false' }}
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Lint and format-check Python
        if: ${{ !cancelled() && fromJSON(steps.changes.outputs.results || '{}')['python'] != 'false' }}
        uses: melodic-software/ci-workflows/.github/actions/ruff@main
        with:
          config: ruff.toml
          exclude: components/ruff/fixtures/bad
      - name: Set up uv
        if: ${{ !cancelled() && fromJSON(steps.changes.outputs.results || '{}')['python'] != 'false' }}
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          python-version: "3.14"
      - name: Install ruff
        if: ${{ !cancelled() && fromJSON(steps.changes.outputs.results || '{}')['python'] != 'false' }}
        run: |
          uv tool install --force "ruff==${RUFF_VERSION}"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Verify toolchain
        if: ${{ !cancelled() && fromJSON(steps.changes.outputs.results || '{}')['python'] != 'false' }}
        run: ruff --version
      - name: Ruff contract test
        if: ${{ !cancelled() && fromJSON(steps.changes.outputs.results || '{}')['python'] != 'false' }}
        run: bash harness/shell/run-tests.sh components/ruff/ruff.test.sh

  check-typescript:
    name: Check TypeScript
    if: ${{ !(github.event.pull_request.head.repo.full_name == github.repository && (contains(fromJSON('["labeled","unlabeled"]'), github.event.action) || (github.event.action == 'edited' && !github.event.changes.base))) }}
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      BIOME_VERSION: 2.5.1
      TYPESCRIPT_VERSION: 6.0.3
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Lint and format-check JS/TS
        if: ${{ !cancelled() }}
        uses: melodic-software/ci-workflows/.github/actions/biome@main
        with:
          config: biome.jsonc
          paths: components/biome/fixtures/good components/concurrency-policy components/dependabot-policy components/github-actions-conventions components/mcp-launcher components/runner-policy distribution
      - name: Set up Node
        if: ${{ !cancelled() }}
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - name: Test tsconfig contract on TypeScript 5.9.3
        if: ${{ !cancelled() }}
        run: npm install --global typescript@5.9.3 && test "$(tsc --version)" = "Version 5.9.3" && bash harness/shell/run-tests.sh components/tsconfig/tsconfig.test.sh # zizmor: ignore[adhoc-packages] exact-pinned toolchain installed on PATH so the tsconfig contract test can drive tsc directly
      - name: Test tsconfig contract on TypeScript 6.0.3
        if: ${{ !cancelled() }}
        run: npm install --global typescript@6.0.3 && test "$(tsc --version)" = "Version 6.0.3" && bash harness/shell/run-tests.sh components/tsconfig/tsconfig.test.sh # zizmor: ignore[adhoc-packages] exact-pinned toolchain installed on PATH so the tsconfig contract test can drive tsc directly
      - name: Test tsconfig contract on TypeScript 7.0.2
        if: ${{ !cancelled() }}
        run: npm install --global typescript@7.0.2 && test "$(tsc --version)" = "Version 7.0.2" && bash harness/shell/run-tests.sh components/tsconfig/tsconfig.test.sh # zizmor: ignore[adhoc-packages] exact-pinned toolchain installed on PATH so the tsconfig contract test can drive tsc directly
      - name: Install biome and tsc
        if: ${{ !cancelled() }}
        run: npm install -g "@biomejs/biome@${BIOME_VERSION}" "typescript@${TYPESCRIPT_VERSION}" # zizmor: ignore[adhoc-packages] exact-pinned tools installed on PATH so the biome/tsconfig contract tests can assert rule codes directly
      - name: Verify toolchain
        if: ${{ !cancelled() }}
        run: |
          biome --version
          tsc --version
      - name: Biome contract test
        if: ${{ !cancelled() }}
        run: bash harness/shell/run-tests.sh components/biome/biome.test.sh
      - name: TypeScript config contract test
        if: ${{ !cancelled() }}
        run: bash harness/shell/run-tests.sh components/tsconfig/tsconfig.test.sh

  check-dotnet:
    name: Check .NET
    if: ${{ !(github.event.pull_request.head.repo.full_name == github.repository && (contains(fromJSON('["labeled","unlabeled"]'), github.event.action) || (github.event.action == 'edited' && !github.event.changes.base))) }}
    permissions:
      contents: read
      pull-requests: read
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      DOTNET_INSTALL_DIR: ~/.dotnet
      DOTNET_VERSION: 11.0.100
    steps:
      - name: Detect relevant changes
        id: changes
        uses: melodic-software/ci-workflows/.github/actions/detect-changes@main
        with:
          filters: |
            dotnet:
              .github/workflows/pr-require-checks.yml
              harness/shell/**
              .node-version
              .editorconfig
              .gitattributes
              .lefthook/dotnet-format.json
              components/dotnet-analysis/**
              components/lefthook-dotnet/**
              Directory.Build.*
              Directory.Packages.props
              global.json
              nuget.config
              NuGet.config
              NuGet.Config
      - name: Check out
        if: ${{ fromJSON(steps.changes.outputs.results || '{}')['dotnet'] != 'false' }}
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up .NET
        if: ${{ !cancelled() && fromJSON(steps.changes.outputs.results || '{}')['dotnet'] != 'false' }}
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Set up Node
        if: ${{ !cancelled() && fromJSON(steps.changes.outputs.results || '{}')['dotnet'] != 'false' }}
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - name: Verify toolchain
        if: ${{ !cancelled() && fromJSON(steps.changes.outputs.results || '{}')['dotnet'] != 'false' }}
        run: |
          dotnet --version
          node --version
      - name: .NET analysis contract test
        if: ${{ !cancelled() && fromJSON(steps.changes.outputs.results || '{}')['dotnet'] != 'false' }}
        run: bash harness/shell/run-tests.sh components/dotnet-analysis/dotnet-analysis.test.sh
      - name: .NET staged-adapter integration
        if: ${{ !cancelled() && fromJSON(steps.changes.outputs.results || '{}')['dotnet'] != 'false' }}
        run: >-
          node components/lefthook-dotnet/dotnet-format-staged.mjs
          components/dotnet-analysis/fixtures/good/Calculator.cs
        env:
          DOTNET_FORMAT_WORKSPACE: components/dotnet-analysis/fixtures/good/good.csproj
      - name: Build .NET (analyzers + code-style as errors)
        if: ${{ !cancelled() && fromJSON(steps.changes.outputs.results || '{}')['dotnet'] != 'false' }}
        uses: melodic-software/ci-workflows/.github/actions/dotnet-build@main
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
          project: components/dotnet-analysis/fixtures/good/good.csproj
      - name: Verify .NET whitespace
        if: ${{ !cancelled() && fromJSON(steps.changes.outputs.results || '{}')['dotnet'] != 'false' }}
        uses: melodic-software/ci-workflows/.github/actions/dotnet-format@main
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
          project: components/dotnet-analysis/fixtures/good/good.csproj

  check-go:
    name: Check Go
    if: ${{ !(github.event.pull_request.head.repo.full_name == github.repository && (contains(fromJSON('["labeled","unlabeled"]'), github.event.action) || (github.event.action == 'edited' && !github.event.changes.base))) }}
    permissions:
      contents: read
      pull-requests: read
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GO_VERSION: 1.26.5
      GOLANGCI_LINT_VERSION: 2.12.2
      GOLANGCI_LINT_SHA256: 8df580d2670fed8fa984aac0507099af8df275e665215f5c7a2ae3943893a553
    steps:
      - name: Detect relevant changes
        id: changes
        uses: melodic-software/ci-workflows/.github/actions/detect-changes@main
        with:
          filters: |
            go:
              .github/workflows/pr-require-checks.yml
              harness/shell/**
              .golangci.yml
              .gitattributes
              go.work
              go.work.sum
              components/go-analysis/**
      - name: Check out
        if: ${{ fromJSON(steps.changes.outputs.results || '{}')['go'] != 'false' }}
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Go
        if: ${{ fromJSON(steps.changes.outputs.results || '{}')['go'] != 'false' }}
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - name: Install golangci-lint from the official release
        if: ${{ fromJSON(steps.changes.outputs.results || '{}')['go'] != 'false' }}
        run: |
          set -euo pipefail
          archive="golangci-lint-${GOLANGCI_LINT_VERSION}-linux-amd64.tar.gz"
          url="https://github.com/golangci/golangci-lint/releases/download/v${GOLANGCI_LINT_VERSION}/${archive}"
          curl -q --fail --silent --show-error --location \
            --proto '=https' --proto-redir '=https' \
            --connect-timeout 10 --max-time 120 \
            --retry 2 --retry-max-time 300 \
            --output "$archive" -- "$url"
          echo "${GOLANGCI_LINT_SHA256}  ${archive}" | sha256sum -c -
          tar -xzf "$archive"
          install_dir="$RUNNER_TEMP/standards-bin"
          mkdir -p "$install_dir"
          install -m 0755 \
            "golangci-lint-${GOLANGCI_LINT_VERSION}-linux-amd64/golangci-lint" \
            "$install_dir/golangci-lint"
          echo "$install_dir" >> "$GITHUB_PATH"
          rm -rf "$archive" "golangci-lint-${GOLANGCI_LINT_VERSION}-linux-amd64"
      - name: Verify exact toolchain
        if: ${{ fromJSON(steps.changes.outputs.results || '{}')['go'] != 'false' }}
        run: |
          test "$(go env GOVERSION)" = "go${GO_VERSION}"
          golangci-lint version | grep -F "version ${GOLANGCI_LINT_VERSION}"
      - name: Go analysis contract test
        if: ${{ fromJSON(steps.changes.outputs.results || '{}')['go'] != 'false' }}
        run: bash harness/shell/run-tests.sh components/go-analysis/go-analysis.test.sh

  check-policies:
    name: Check Policies
    if: ${{ !(github.event.pull_request.head.repo.full_name == github.repository && (contains(fromJSON('["labeled","unlabeled"]'), github.event.action) || (github.event.action == 'edited' && !github.event.changes.base))) }}
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Node
        if: ${{ !cancelled() }}
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: |
            package-lock.json
            components/runner-policy/package-lock.json
            components/concurrency-policy/package-lock.json
            components/dependabot-policy/package-lock.json
            components/pr-convention-policy/package-lock.json
      - name: Install policy dependencies
        if: ${{ !cancelled() }}
        run: |
          npm ci
          npm ci --prefix components/runner-policy --ignore-scripts
          npm ci --prefix components/concurrency-policy --ignore-scripts
          npm ci --prefix components/dependabot-policy --ignore-scripts
          npm ci --prefix components/pr-convention-policy --ignore-scripts
      - name: Test runner policy
        if: ${{ !cancelled() }}
        run: npm run test:runner-policy
      - name: Enforce runner policy on standards
        if: ${{ !cancelled() }}
        run: npm run lint:runner-policy
        env:
          CI_REPOSITORY_VISIBILITY: ${{ github.event.repository.visibility }}
      - name: Test concurrency policy
        if: ${{ !cancelled() }}
        run: npm run test:concurrency-policy
      - name: Enforce concurrency policy on standards
        if: ${{ !cancelled() }}
        run: npm run lint:concurrency-policy
      - name: Test dependabot policy
        if: ${{ !cancelled() }}
        run: npm run test:dependabot-policy
      - name: Enforce dependabot policy on standards
        if: ${{ !cancelled() }}
        run: npm run lint:dependabot-policy
      - name: Enforce the auto-merge allowlist lockstep with ci-workflows
        if: ${{ !cancelled() }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: npm run lint:dependabot-automerge-lockstep
      - name: Test pr-convention policy
        if: ${{ !cancelled() }}
        run: npm run test:pr-convention-policy
      - name: Enforce pr-convention policy sample
        if: ${{ !cancelled() }}
        run: npm run lint:pr-convention-policy
      - name: Test issue-body contract
        if: ${{ !cancelled() }}
        run: npm run test:issue-forms
      - name: Enforce generated issue forms match the contract
        if: ${{ !cancelled() }}
        run: npm run lint:issue-forms
      - name: Test PR and issue contract docs generator
        if: ${{ !cancelled() }}
        run: npm run test:contract-docs
      - name: Enforce generated PR template, rule and filing guide match their records
        if: ${{ !cancelled() }}
        run: npm run lint:contract-docs

  check-pr-convention-copies:
    name: Check PR Convention Copies
    if: ${{ !(github.event.pull_request.head.repo.full_name == github.repository && (contains(fromJSON('["labeled","unlabeled"]'), github.event.action) || (github.event.action == 'edited' && !github.event.changes.base))) }}
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: |
            components/pr-convention-policy/package-lock.json
            components/runner-policy/package-lock.json
      - name: Install pr-convention-policy dependencies
        run: |
          npm ci --prefix components/pr-convention-policy --ignore-scripts
          npm ci --prefix components/runner-policy --ignore-scripts
      - name: Ensure gawk for the sandboxed analyzer run
        run: |
          set -euo pipefail
          if ! command -v gawk >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq --no-install-recommends gawk
          fi
          gawk --version | head -n 1
      - name: Test lockstep parsers and mutation probes (hermetic)
        run: npm run test:pr-convention-lockstep
      - name: Enforce lockstep against the live copies
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: npm run lint:pr-convention-copies
      - name: Commit-convention contract test
        if: ${{ !cancelled() }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash harness/shell/run-tests.sh components/commit-convention/commit-convention.test.sh

  check-github-actions:
    name: Check GitHub Actions
    if: ${{ !(github.event.pull_request.head.repo.full_name == github.repository && (contains(fromJSON('["labeled","unlabeled"]'), github.event.action) || (github.event.action == 'edited' && !github.event.changes.base))) }}
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Lint workflows
        if: ${{ !cancelled() }}
        uses: melodic-software/ci-workflows/.github/actions/actionlint@main
      - name: Test actionlint component
        if: ${{ !cancelled() }}
        run: bash harness/shell/run-tests.sh components/actionlint/actionlint.test.sh
      - name: Install yq 4.53.3
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          version=4.53.3
          sha=fa52a4e758c63d38299163fbdd1edfb4c4963247918bf9c1c5d31d84789eded4
          url="https://github.com/mikefarah/yq/releases/download/v${version}/yq_linux_amd64"
          curl -fsSL "$url" -o yq
          echo "${sha}  yq" | sha256sum -c -
          sudo install yq /usr/local/bin/yq
          rm yq
          yq --version
      - name: Set up Node
        if: ${{ !cancelled() }}
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: |
            distribution/package-lock.json
            components/runner-policy/package-lock.json
            components/github-actions-conventions/package-lock.json
      - name: Install distribution, runner-policy and naming-lint dependencies
        if: ${{ !cancelled() }}
        run: |
          npm ci --prefix distribution --ignore-scripts
          npm ci --prefix components/runner-policy --ignore-scripts
          npm ci --prefix components/github-actions-conventions --ignore-scripts
      - name: Test claude lane caller components
        if: ${{ !cancelled() }}
        run: bash harness/shell/run-tests.sh components/claude-lanes/claude-lanes.test.sh
      - name: Test the managed-files-guard caller component
        if: ${{ !cancelled() }}
        run: bash harness/shell/run-tests.sh components/managed-files-guard/managed-files-guard.test.sh
      - name: Test the dependabot-automerge caller components
        if: ${{ !cancelled() }}
        run: bash harness/shell/run-tests.sh components/dependabot-automerge/dependabot-automerge.test.sh
      - name: Test naming conventions
        if: ${{ !cancelled() }}
        run: npm run test:github-actions-conventions
      - name: Check naming conventions on standards
        if: ${{ !cancelled() }}
        run: |
          set -uo pipefail
          report="$RUNNER_TEMP/naming-lint.txt"
          status=0
          npm run --silent lint:github-actions-conventions -- --format text > "$report" || status=$?
          {
            echo '### naming-lint (enforcing)'
            echo '```text'
            cat "$report"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          cat "$report"
          exit "$status"

  pr-audit-workflows:
    name: PR Audit Workflows
    if: ${{ !(github.event.pull_request.head.repo.full_name == github.repository && (contains(fromJSON('["labeled","unlabeled"]'), github.event.action) || (github.event.action == 'edited' && !github.event.changes.base))) }}
    permissions:
      contents: read
      # A called workflow can only narrow the caller's permissions, so its grant is made here:
      # https://docs.github.com/en/actions/how-tos/reuse-automations/reuse-workflows
      security-events: write
    # zizmor finds workflows only under `.github/workflows`, so the shipped workflow components are named:
    # https://docs.zizmor.sh/usage/
    uses: melodic-software/ci-workflows/.github/workflows/pr-audit-workflows.yml@main
    with:
      runner: ubuntu-24.04
      paths: . components/claude-lanes/claude-review.yml components/claude-lanes/claude-security-review.yml components/claude-lanes-hosted/claude-review.yml components/claude-lanes-hosted/claude-security-review.yml components/dependabot-automerge/dependabot-automerge.yml components/dependabot-automerge/dependabot-automerge-fleet.yml components/managed-files-guard/managed-files-guard.yml components/managed-files-guard/managed-files-guard-fleet.yml
      fail-on-severity: low

  pr-scan-dependencies:
    name: PR Scan Dependencies
    if: ${{ !(github.event.pull_request.head.repo.full_name == github.repository && (contains(fromJSON('["labeled","unlabeled"]'), github.event.action) || (github.event.action == 'edited' && !github.event.changes.base))) }}
    permissions:
      contents: read
    uses: melodic-software/ci-workflows/.github/workflows/pr-scan-dependencies.yml@main
    with:
      runner: ubuntu-24.04

  test-cloud-environment:
    name: Test Cloud Environment
    if: ${{ !(github.event.pull_request.head.repo.full_name == github.repository && (contains(fromJSON('["labeled","unlabeled"]'), github.event.action) || (github.event.action == 'edited' && !github.event.changes.base))) }}
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Cloud contract tests (environment + bootstrap)
        if: ${{ !cancelled() }}
        run: >-
          bash harness/shell/run-tests.sh
          components/cloud-environment/setup.test.sh
          components/cloud-environment/vault-exec.test.sh
          components/cloud-environment/pages-publish.test.sh
          components/cloud-environment/rendered-views-sync.test.sh
          components/cloud-bootstrap/cloud-bootstrap.test.sh
          .cursor/install.test.sh
      - name: Set up Node
        if: ${{ !cancelled() }}
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - name: MCP launcher --vault tests
        if: ${{ !cancelled() }}
        run: node --test components/mcp-launcher/launcher.test.mjs

  test-distribution:
    name: Test Distribution
    if: ${{ !(github.event.pull_request.head.repo.full_name == github.repository && (contains(fromJSON('["labeled","unlabeled"]'), github.event.action) || (github.event.action == 'edited' && !github.event.changes.base))) }}
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: distribution/package-lock.json
      - name: Install distribution dependencies
        run: npm ci --prefix distribution --ignore-scripts
      - name: Install yq 4.53.3
        run: |
          set -euo pipefail
          version=4.53.3
          sha=fa52a4e758c63d38299163fbdd1edfb4c4963247918bf9c1c5d31d84789eded4
          url="https://github.com/mikefarah/yq/releases/download/v${version}/yq_linux_amd64"
          curl -fsSL "$url" -o yq
          echo "${sha}  yq" | sha256sum -c -
          sudo install yq /usr/local/bin/yq
          rm yq
          yq --version
      - name: Test distribution engine
        if: ${{ !cancelled() }}
        run: bash distribution/sync-manifest.test.sh
      - name: Claude-permissions tombstone contract test
        if: ${{ !cancelled() }}
        run: bash harness/shell/run-tests.sh components/claude-permissions/claude-permissions.test.sh
      - name: Trusted-actors list contract test
        if: ${{ !cancelled() }}
        run: node --test components/trusted-actors/trusted-actors.test.mjs
      - name: Claude-settings target conformance test
        if: ${{ !cancelled() }}
        run: bash harness/shell/run-tests.sh distribution/check-claude-settings-targets.test.sh
      - name: Validate production manifest
        if: ${{ !cancelled() }}
        run: bash distribution/sync-manifest.sh validate

  ci-status:
    name: CI Status
    if: ${{ !cancelled() }}
    permissions:
      actions: write
      contents: read
      pull-requests: write
      statuses: write
    needs:
      - check-shell
      - check-markdown-and-links
      - check-repo-hygiene
      - check-powershell
      - test-lefthook
      - check-python
      - check-typescript
      - check-dotnet
      - check-go
      - check-policies
      - check-pr-convention-copies
      - check-github-actions
      - pr-audit-workflows
      - pr-scan-dependencies
      - test-cloud-environment
      - test-distribution
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Aggregate lane results
        id: report
        uses: melodic-software/ci-workflows/.github/actions/pr-require-checks/report-ci-status@main
        with:
          step-name: Aggregate lane results
          exempt-authors: 'dependabot[bot]'
          draft: allow
          results: >-
            ${{ needs.check-shell.result }}
            ${{ needs.check-markdown-and-links.result }}
            ${{ needs.check-repo-hygiene.result }}
            ${{ needs.check-powershell.result }}
            ${{ needs.test-lefthook.result }}
            ${{ needs.check-python.result }}
            ${{ needs.check-typescript.result }}
            ${{ needs.check-dotnet.result }}
            ${{ needs.check-go.result }}
            ${{ needs.check-policies.result }}
            ${{ needs.check-pr-convention-copies.result }}
            ${{ needs.check-github-actions.result }}
            ${{ needs.pr-audit-workflows.result }}
            ${{ needs.pr-scan-dependencies.result }}
            ${{ needs.test-cloud-environment.result }}
            ${{ needs.test-distribution.result }}
      - name: Fail on the contract or draft policy
        if: ${{ !cancelled() && (steps.report.outputs.contract != 'success' || steps.report.outputs.draft != 'success') }}
        run: |
          echo "::error::ci-status: the pull-request contract or the draft policy failed; see the step above."
          exit 1
