name: PR Review

on:
  pull_request:
    # `synchronize` covers the conflict-resolving push: no pull_request run fires while a PR conflicts:
    # https://docs.github.com/en/actions/reference/workflows-and-actions/events-that-trigger-workflows#pull_request
    types: [opened, synchronize, ready_for_review, reopened]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  pr-review:
    name: PR Review
    if: github.event.pull_request.draft == false
    permissions:
      actions: read          # check-key-credit reads its marker; Publish Review reads this workflow's runs
      checks: read           # Publish Review reads its earlier runs' cost notices
      contents: read         # checkout + read the diff
      issues: read           # read closing issues on private repositories
      pull-requests: write   # post review, comments, and the lane's reviewed-head marker comment
    uses: melodic-software/ci-workflows/.github/workflows/pr-review-cli.yml@main
    with:
      lane: code
      publish: comments
      allowed-author-ids: '153232337'
    secrets:
      CLAUDE_API_KEY: ${{ secrets.REVIEWS_CLAUDE_API_KEY }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.REVIEWS_CLAUDE_CODE_OAUTH_TOKEN }}
      FALLBACK_CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.FALLBACK_CLAUDE_CODE_OAUTH_TOKEN }}
