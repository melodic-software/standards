name: standards-sync-stuck-automerge-alert

# Watchdog for sync.yml's auto-merge arming: scans standards-sync target repos
# (read from the manifest, never hardcoded) for App-authored sync PRs in either
# failure state — armed but BLOCKED past a threshold, or never armed at all on
# a target the manifest marks `automerge: true` — and files/refreshes a rolling
# tracking issue in the one repository named below through
# `tracking-issue-repository` — never defaulted to this repo, never scattered
# across the scanned targets.
#
# That repository is `medley`, for a caller-specific reason on top of the
# reusable's own (its header owns why the destination must be a repository the
# issue-authoring App is installed on, which this calling repo is not): the
# alert body embeds each reported PR's repository name, number, and URL, four
# of the eight scanned targets are private, and this repository is public —
# filing here would republish private repository names and PR URLs in public.
# `medley` is itself one of the scanned targets, and private; that it may
# report on its own sync PRs is incidental, not the reason it was chosen.
#
# The never-armed half only considers `automerge: true` targets, so it is inert
# for the duration of a rollout window that opts every target out.
#
# A mint or infrastructure failure in the reusable leaves the watchdog dark
# without filing a tracking issue — the same silent-death mode
# queue-monitor-liveness.yml guards against for the queue monitor
# (melodic-software/ci-workflows#105). The `liveness` job below fails the
# caller workflow loudly on any `alert` failure so the next occurrence is
# visible without reading run history (standards#318).
on:
  workflow_dispatch:
  schedule:
    # Off-minute hourly poll: catches an armed PR stuck behind an unrelated
    # gate failure well within a single working day.
    - cron: "17 * * * *"

permissions:
  contents: read

jobs:
  alert:
    uses: melodic-software/ci-workflows/.github/workflows/standards-sync-stuck-automerge-alert.yml@ed6d410c1fe10d9deb40241bbe46428b31fafd57 # ed6d410 2026-08-04
    with:
      runner: ubuntu-24.04
      # Bare name under this repository's own owner — `owner/repo` is rejected
      # by the reusable's first step.
      tracking-issue-repository: medley
    secrets:
      app-client-id: ${{ secrets.STANDARDS_SYNC_APP_CLIENT_ID }}
      app-private-key: ${{ secrets.STANDARDS_SYNC_APP_PRIVATE_KEY }}

  liveness:
    name: Fail loudly when the watchdog cannot run
    needs: alert
    if: failure()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Surface stuck-automerge alert failure
        env:
          ALERT_RESULT: ${{ needs.alert.result }}
        run: |
          set -euo pipefail
          {
            echo "## Stuck-automerge alert liveness failure"
            echo
            echo "The \`alert\` job finished with \`${ALERT_RESULT}\`. The standards-sync stuck-automerge watchdog is dark and would not have filed or refreshed a tracking issue in \`medley\`."
            echo
            echo "Inspect the \`alert\` job logs — token-mint failures, manifest checkout faults, and upstream API errors commonly land here."
            echo
            echo "When stuck PRs are detected, the reusable workflow still fails and files through \`tracking-issue-repository: medley\`; this liveness job covers infrastructure death modes only."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::error::standards-sync-stuck-automerge-alert failed (alert job result: ${ALERT_RESULT}). The watchdog is dark — inspect mint credentials, App installation selection, and upstream API health."
          exit 1
