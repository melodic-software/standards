name: standards-sync-stuck-automerge-alert

# Watchdog for sync.yml's auto-merge arming: scans standards-sync target repos
# (read from the manifest, never hardcoded) for App-authored sync PRs in either
# failure state — armed but BLOCKED past a threshold, or never armed at all on
# a target the manifest marks `automerge: true` — and files/refreshes a rolling
# tracking issue in the one repository named below through
# `tracking-issue-repository` — never defaulted to this repo, never scattered
# across the scanned targets.
#
# That repository is `medley`, for a caller-specific reason on top of the
# reusable's own (its header owns why the destination must be a repository the
# issue-authoring App is installed on, which this calling repo is not): the
# alert body embeds each reported PR's repository name, number, and URL, four
# of the eight scanned targets are private, and this repository is public —
# filing here would republish private repository names and PR URLs in public.
# `medley` is itself one of the scanned targets, and private; that it may
# report on its own sync PRs is incidental, not the reason it was chosen.
#
# The never-armed half only considers `automerge: true` targets, so a
# per-target `automerge: false` opt-out (a staged-rollout window) keeps that
# target out of the never-armed scan for exactly as long as the opt-out holds.
#
# A mint or infrastructure failure in the reusable leaves the watchdog dark
# without filing a tracking issue — the same silent-death mode
# queue-monitor-liveness.yml guards against for the queue monitor
# (melodic-software/ci-workflows#105). The `classify-alert-failure` job
# inspects the reusable's step graph so the `liveness` job below fires only
# on infrastructure or cancellation death modes, not on the reusable's
# deliberate failure after it files on stuck PRs (standards#318).
on:
  workflow_dispatch:
    inputs:
      test-mode:
        description: >-
          Fabricate synthetic candidates under a test-only marker/title in
          medley instead of scanning live targets — proves the tracking-issue
          create/update/close/fail lifecycle without a real stuck PR.
        type: boolean
        default: false
      test-synthetic-candidates:
        description: >-
          Synthetic candidate count as a string ('0', '1', or '2'); ignored
          unless test-mode. '0' drives the close path.
        type: string
        default: "1"
  schedule:
    # Off-minute hourly poll: catches an armed PR stuck behind an unrelated
    # gate failure well within a single working day.
    - cron: "17 * * * *"

permissions:
  contents: read

# A dispatched test run and the hourly poll otherwise race the same rolling
# issue: two concurrent creates would file two marker-carrying issues, and the
# reusable's lookup deliberately fails closed on that ambiguity forever after.
concurrency:
  group: standards-sync-stuck-automerge-alert
  cancel-in-progress: false

jobs:
  alert:
    uses: melodic-software/ci-workflows/.github/workflows/standards-sync-stuck-automerge-alert.yml@01c3295629ab9dea9a602ddb9e2217c83f014a10 # v0.15.0
    with:
      runner: ubuntu-24.04
      # Bare name under this repository's own owner — `owner/repo` is rejected
      # by the reusable's first step.
      tracking-issue-repository: medley
      # `with:` keys cannot be conditionally omitted, so both test inputs are
      # passed on every run with schedule-safe defaults: a cron event carries
      # no inputs, the expressions resolve to false/'1', and the reusable
      # ignores the count outside test mode. The count fallback is an explicit
      # empty-string test — a bare `||` would swallow the legal '0' that
      # drives the close-path proof.
      test-mode: ${{ github.event.inputs.test-mode == 'true' }}
      test-synthetic-candidates: ${{ github.event.inputs.test-synthetic-candidates == '' && '1' || github.event.inputs.test-synthetic-candidates }}
    secrets:
      app-client-id: ${{ secrets.STANDARDS_SYNC_APP_CLIENT_ID }}
      app-private-key: ${{ secrets.STANDARDS_SYNC_APP_PRIVATE_KEY }}

  classify-alert-failure:
    name: Distinguish alert failure modes
    needs: alert
    if: always() && needs.alert.result != 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      infrastructure-failure: ${{ steps.classify.outputs.infrastructure-failure }}
    steps:
      - name: Classify whether alert failed for infrastructure
        id: classify
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ALERT_RESULT: ${{ needs.alert.result }}
        run: |
          set -euo pipefail
          if [[ "$ALERT_RESULT" == "cancelled" ]]; then
            echo "infrastructure-failure=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "$ALERT_RESULT" != "failure" ]]; then
            echo "infrastructure-failure=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # The reusable's final step fails deliberately after filing when stuck
          # PRs are found. Only earlier step failures are infrastructure death.
          #
          # Matched by SUFFIX, not equality: the jobs API returns a reusable
          # workflow's jobs prefixed with the caller job id ("alert / Detect
          # …"), verified live 2026-08-17 (run 32039984123) — an exact match
          # never hit, so every deliberate post-filing failure would have been
          # misclassified as infrastructure death. Both bare and prefixed
          # forms are accepted in case GitHub ever drops the prefix.
          jobs_json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/jobs")"
          alert_job_id="$(jq -r '.jobs[] | select(.name | endswith("Detect standards-sync auto-merge PRs that cannot merge themselves")) | .id' <<<"$jobs_json" | head -1)"
          if [[ -z "$alert_job_id" || "$alert_job_id" == "null" ]]; then
            echo "::warning::Could not locate the alert job; treating failure as infrastructure."
            echo "infrastructure-failure=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          steps_json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/jobs/${alert_job_id}/steps")"
          notify_conclusion="$(jq -r '.steps[] | select(.name == "Fail so the scheduled run notifies") | .conclusion' <<<"$steps_json" | head -1)"
          if [[ "$notify_conclusion" == "failure" ]]; then
            echo "infrastructure-failure=false" >> "$GITHUB_OUTPUT"
          else
            echo "infrastructure-failure=true" >> "$GITHUB_OUTPUT"
          fi

  liveness:
    name: Fail loudly when the watchdog cannot run
    needs: [alert, classify-alert-failure]
    if: always() && needs.classify-alert-failure.outputs.infrastructure-failure == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Surface stuck-automerge alert failure
        env:
          ALERT_RESULT: ${{ needs.alert.result }}
        run: |
          set -euo pipefail
          {
            echo "## Stuck-automerge alert liveness failure"
            echo
            echo "The \`alert\` job finished with \`${ALERT_RESULT}\`. The standards-sync stuck-automerge watchdog is dark and would not have filed or refreshed a tracking issue in \`medley\`."
            echo
            echo "Inspect the \`alert\` job logs — token-mint failures, manifest checkout faults, and upstream API errors commonly land here."
            echo
            echo "When stuck PRs are detected, the reusable workflow still fails and files through \`tracking-issue-repository: medley\`; this liveness job covers infrastructure death modes only."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::error::standards-sync-stuck-automerge-alert failed (alert job result: ${ALERT_RESULT}). The watchdog is dark — inspect mint credentials, App installation selection, and upstream API health."
          exit 1
