# The `issues` `field_added` and `field_removed` activity types the pinned
# actionlint rejects, in the shape claude-code-plugins intake-reenter.yml uses.
name: field-added fixture
on:
  issues:
    types: [labeled, field_added, field_removed]
permissions: {}
jobs:
  noop:
    runs-on: ubuntu-24.04
    steps:
      - name: No-op
        run: exit 0
