# Mirrors the Phase 4 three-job shape: the self-hosted fleet labels the
# ci-perf program writes literally in `runs-on`, one job per label.
name: fleet-runner-labels fixture
on: push
jobs:
  build:
    runs-on: melodic-ubuntu-24.04-x64
    steps:
      - name: No-op
        run: exit 0
  review:
    runs-on: melodic-review-ubuntu-24.04-x64
    steps:
      - name: No-op
        run: exit 0
