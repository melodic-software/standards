# Mirrors the Claude review caller's serialization shape: the GA
# `concurrency.queue` key the pinned actionlint rejects (rhysd/actionlint#654).
name: queue-concurrency fixture
on: push
concurrency:
  group: fixture-${{ github.ref }}
  queue: max
jobs:
  noop:
    runs-on: ubuntu-24.04
    steps:
      - name: No-op
        run: exit 0
