name: PR Review

# SYNC-MANAGED FILE — DO NOT EDIT IN THE CONSUMING REPOSITORY.
# Source of truth: melodic-software/standards,
# components/claude-lanes/claude-review.yml (the `claude-review-caller`
# component in distribution/sync-manifest.yml). Downstream edits are
# overwritten by the next sync PR; change the component upstream, or move the
# component to `locally-owned` in the manifest to customize.

on:
  pull_request:
    # `synchronize` covers the push that resolves a conflict: no pull_request workflow runs during one:
    # https://docs.github.com/en/actions/reference/workflows-and-actions/events-that-trigger-workflows#pull_request
    # A re-run keeps the original event's GITHUB_SHA, so push to review a newer head:
    # https://docs.github.com/en/actions/how-tos/manage-workflow-runs/re-run-workflows-and-jobs
    types: [opened, synchronize, ready_for_review, reopened]

# A called workflow can only downgrade this grant, never elevate it:
# https://docs.github.com/en/actions/reference/workflows-and-actions/reusing-workflow-configurations
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  pr-review:
    name: PR Review
    if: github.event.pull_request.draft == false
    permissions:
      actions: read          # check-key-credit reads its marker; Publish Review reads this workflow's runs
      checks: read           # Publish Review reads its earlier runs' cost notices
      contents: read         # checkout + read the diff
      issues: read           # read closing issues on private repositories
      pull-requests: write   # post review, comments, and the lane's reviewed-head marker comment
    uses: melodic-software/ci-workflows/.github/workflows/pr-review-cli.yml@main
    with:
      lane: code
      publish: comments
      runner: melodic-review-ubuntu-24.04-x64
      allowed-bot-sender-ids: ${{ vars.AUTOMATION_LANES_APP_SENDER_ID }}
      allowed-author-ids: '153232337'
    secrets:
      CLAUDE_API_KEY: ${{ secrets.REVIEWS_CLAUDE_API_KEY }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.REVIEWS_CLAUDE_CODE_OAUTH_TOKEN }}
      FALLBACK_CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.FALLBACK_CLAUDE_CODE_OAUTH_TOKEN }}
