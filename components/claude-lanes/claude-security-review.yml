name: claude-security-review

# SYNC-MANAGED FILE — DO NOT EDIT IN THE CONSUMING REPOSITORY.
# Source of truth: melodic-software/standards,
# components/claude-lanes/claude-security-review.yml (the
# `claude-security-review-caller` component in distribution/sync-manifest.yml).
# Downstream edits are overwritten by the next sync PR; change the component
# upstream, or move the component to `locally-owned` in the manifest to
# customize.
#
# Thin caller for the org's reusable security-review lane (advisory verdict,
# fail-closed execution check). The reusable workflow owns the action pin,
# model, relevance gate, retry, kill-switches, and the secret-handling model;
# per its CONSUMER CONTRACT header, this caller owns the triggers and the
# GITHUB_TOKEN permission grant.
#
# PATHS-FILE CONVENTION: the consuming repo owns `.github/claude-security-paths`
# — root-anchored gitignore patterns, one per line, matched via `git
# check-ignore` (`#` comments and blank lines ignored). Hard-errors on `!`,
# `?`, or `+`. Names that repo's security-sensitive surfaces. The
# reusable reads it from the PR's BASE branch, never the head. An ABSENT file
# FAILS OPEN: every PR is security-reviewed until the repo commits one. The
# file is repo-owned tuning and is deliberately NOT sync-managed.
#
# NEVER add workflow-level `paths:`/`paths-ignore:` to this caller: a
# required check whose workflow never triggers stays Pending forever and
# wedges every out-of-scope PR. The reusable's `changes` job owns relevance
# and reports a name-stable SKIPPED check instead, which a ruleset reads as
# success.
#
# Fork PRs receive no secrets and a read-only token, so they are simply not
# reviewed by design; a required check does NOT prove a fork PR was reviewed
# (see the reusable's header).
#
# RUNNER PLACEMENT: this component names the governed managed fleet review
# label directly, for the same reason and under the same inventory constraint
# as the code-review caller. See that file's header.

on:
  pull_request:
    # No `synchronize`, matching the code-review lane: one review per pull
    # request. The earlier rationale for keeping it was that a REQUIRED
    # execution-evidence check must report on the latest head, and that
    # constraint is not live. github-iac ADR 0011 makes agentic reviews
    # advisory and forbids any organization ruleset from making their status a
    # merge or deployment prerequisite, and the `security-review-gate` ruleset
    # is disabled. Re-review of a newer head is a reopen or a draft flip.
    #
    # NO `merge_group:`: the pinned action cannot serve that event; see
    # melodic-software/ci-workflows#272 before enabling a merge queue.
    types: [opened, ready_for_review, reopened]

permissions:
  contents: read

# No top-level concurrency block: the standards `concurrency-policy` component
# requires a `${{ github.workflow }}`-prefixed group and literal
# `cancel-in-progress: true`, which this lane cannot ship. A cancelled run of
# a check a ruleset might later read is not a skip and does not read success,
# so cancelling an in-flight review can wedge the merge behind a void check.
# Concurrency lives on the `security-review` job below
# (`cancel-in-progress: false`, no queue), which is the shape a
# `delegated-job-level` concurrency-policy exception waives. And NO job-level
# queue group: a full queue CANCELS new arrivals, which is the same wedge; a
# queue is added only if overflow smoke-testing proves otherwise. These are
# per-LANE values, deliberately different from the code-review caller's (which
# cancels superseded runs and queues repo-wide). Do not normalize the two.

jobs:
  security-review:
    # A draft is work in progress and does not spend a review. The event_name
    # clause mirrors the code-review caller's so the two lanes read the same
    # way; this workflow has no dispatch trigger today, and the clause stays
    # correct if one is added.
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.draft == false
    permissions:
      contents: read         # checkout + read the diff
      pull-requests: write   # post the security review + tracking comment
      id-token: write        # OIDC, mints the Claude GitHub App token (required
                             # even with an OAuth/API-key credential)
    # Per-PR serialization without cancellation. See the workflow header.
    concurrency:
      group: claude-security-review-${{ github.event.pull_request.number || github.run_id }}
      cancel-in-progress: false
    uses: melodic-software/ci-workflows/.github/workflows/claude-security-review.yml@0f8176e87e0be518f382664779655011bf95784a # v0.17.2
    with:
      runner: melodic-review-ubuntu-24.04-x64
      paths-file: .github/claude-security-paths
    # No `timeout-minutes`: the reusable exposes no such input at this pin or
    # at `main`, so the lane keeps the reusable's own job budget. No
    # `pr-number` either: it is not in this contract's reviewed input list.
    # Both are ci-workflows work items, not caller edits.
    #
    # Pass only the one named secret (least privilege) rather than
    # `secrets: inherit`, which would forward every parent secret to the
    # called workflow.
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
