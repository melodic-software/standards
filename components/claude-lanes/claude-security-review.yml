name: PR Review Security

# SYNC-MANAGED FILE — DO NOT EDIT IN THE CONSUMING REPOSITORY.
# Source of truth: melodic-software/standards,
# components/claude-lanes/claude-security-review.yml (the
# `claude-security-review-caller` component in distribution/sync-manifest.yml).
# Downstream edits are overwritten by the next sync PR; change the component
# upstream, or move the component to `locally-owned` in the manifest to
# customize.

# No workflow-level paths:/paths-ignore: a required check that never triggers stays Pending:
# https://docs.github.com/en/pull-requests/collaborating-with-pull-requests/collaborating-on-repositories-with-code-quality-features/troubleshooting-required-status-checks
on:
  pull_request:
    # `synchronize` covers the push that resolves a conflict: no pull_request workflow runs during one:
    # https://docs.github.com/en/actions/reference/workflows-and-actions/events-that-trigger-workflows#pull_request
    types: [opened, synchronize, ready_for_review, reopened]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  pr-review-security:
    name: PR Review Security
    if: github.event.pull_request.draft == false
    permissions:
      actions: read
      checks: read
      contents: read
      issues: read
      pull-requests: write
    uses: melodic-software/ci-workflows/.github/workflows/pr-review-cli.yml@main
    with:
      lane: security
      publish: comments
      runner: melodic-review-ubuntu-24.04-x64
      docs-only-paths: |
        docs/**/*.md
        **/README.md
        **/CHANGELOG.md
      allowed-bot-sender-ids: ${{ vars.AUTOMATION_LANES_APP_SENDER_ID }}
    secrets:
      CLAUDE_API_KEY: ${{ secrets.REVIEWS_CLAUDE_API_KEY }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.REVIEWS_CLAUDE_CODE_OAUTH_TOKEN }}
      FALLBACK_CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.FALLBACK_CLAUDE_CODE_OAUTH_TOKEN }}
