name: PR Automerge Dependabot

# SYNC-MANAGED FILE: DO NOT EDIT IN THE CONSUMING REPOSITORY.
# Source of truth: melodic-software/standards,
# components/dependabot-automerge/dependabot-automerge-fleet.yml (the
# `dependabot-automerge-fleet-caller` component in
# distribution/sync-manifest.yml). Downstream edits are overwritten by the next
# sync PR; change the component upstream, or move the component to
# `locally-owned` in the manifest to customize.

on:
  pull_request:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  pr-automerge-dependabot:
    name: PR Automerge Dependabot
    permissions:
      contents: write # enablePullRequestAutoMerge requires it.
      pull-requests: write # Arm or disarm auto-merge on the PR.
    uses: melodic-software/ci-workflows/.github/workflows/pr-automerge-dependabot.yml@main
    with:
      runner: melodic-ubuntu-24.04-x64
