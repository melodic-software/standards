# No `skip` here: extended settings override the consumer's lefthook.yml, so the consumer
# owns opt-outs (lefthook-merge-skip.test.sh): https://lefthook.dev/configuration/extends/
min_version: "2.0.0"
assert_lefthook_installed: true
# The default matcher's `**/*.ext` misses repo-root files; doublestar matches them:
# https://lefthook.dev/configuration/glob_matcher/
glob_matcher: doublestar

pre-commit:
  parallel: true
  commands:
    typos:
      glob: "**/*"
      run: typos {staged_files}
      fail_text: "Spelling issues. Fix them, or record a false positive per the Typos component's escape hatches."
    gitleaks:
      run: gitleaks git --pre-commit --staged --no-banner
      fail_text: "Potential secret in staged changes. Remove it, or allowlist a verified false positive in .gitleaks.toml."
    editorconfig:
      glob: "**/*"
      run: editorconfig-checker {staged_files}
      fail_text: "EditorConfig violation. Align with .editorconfig (most editors auto-fix on save)."
    markdownlint:
      glob: "**/*.{md,markdown}"
      run: "test -x node_modules/.bin/markdownlint-cli2 || { case $(command -v npm 2>/dev/null || true) in ''|/mnt/*) if test -f ~/.config/shell/env.sh; then . ~/.config/shell/env.sh; fi ;; esac; case $(command -v npm 2>/dev/null || true) in /mnt/*) echo 'Refusing npm ci via Windows interop path in WSL.' >&2; false ;; *) case $(uname -s) in Linux) timeout 120 npm ci --no-audit --no-fund >&2 ;; *) npm ci --no-audit --no-fund >&2 ;; esac ;; esac && test -x node_modules/.bin/markdownlint-cli2; } || { echo 'markdownlint-cli2 not found at node_modules/.bin/markdownlint-cli2. Run: npm ci' >&2; exit 1; }; node_modules/.bin/markdownlint-cli2 {staged_files}"
      fail_text: "Markdown lint failures, or markdownlint-cli2 missing and npm ci failed (run: npm ci). Fix violations: node_modules/.bin/markdownlint-cli2 --fix <file>"
