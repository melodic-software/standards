# The default matcher's `**` must consume a directory, so `**/*.ext` would miss
# root files: https://lefthook.dev/configuration/glob_matcher/
glob_matcher: doublestar

pre-commit:
  jobs:
    - name: dotnet-format
      glob: "**/*.cs"
      run: node .lefthook/dotnet-format-staged.mjs {staged_files}
      fail_text: >-
        Whitespace/layout drift or invalid dotnet-format.json. Run: dotnet
        format whitespace <workspace> --include <files>
