# The default matcher's `**` must consume a directory, so `**/*.ext` would miss
# root files: https://lefthook.dev/configuration/glob_matcher/
glob_matcher: doublestar

pre-commit:
  commands:
    ruff-lint:
      glob: "**/*.{py,pyi}"
      run: ruff check {staged_files}
      fail_text: "Ruff lint failures. Run: ruff check --fix <files>"
    ruff-format:
      glob: "**/*.{py,pyi}"
      run: ruff format --check {staged_files}
      fail_text: "Ruff format drift. Run: ruff format <files>"
