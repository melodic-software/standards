# Opt-in ShellCheck hook. ShellCheck discovers the root .shellcheckrc, so this
# adapter contains execution only and does not duplicate policy.
#
# This fragment declares no `skip`. Whether a lane sits out merge and rebase
# commits is the CONSUMER's call, made in its own root lefthook.yml -- a `skip`
# here would win over the consumer's and silently defeat the documented
# `skip: true` opt-out. See lefthook-base's header for the full rule.

pre-commit:
  commands:
    shellcheck:
      glob: "**/*.{sh,bash}"
      run: shellcheck {staged_files}
      fail_text: "ShellCheck findings. Fix them, or annotate a justified exception with a shellcheck directive."
