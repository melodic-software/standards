# The default matcher's `**` must consume a directory, so `**/*.ext` would miss
# root files: https://lefthook.dev/configuration/glob_matcher/
glob_matcher: doublestar

pre-commit:
  commands:
    biome:
      glob: "**/*.{ts,tsx,cts,mts,js,jsx,cjs,mjs,json,jsonc}"
      exclude:
        - "**/packages.lock.json"
      run: npx --no-install @biomejs/biome check --no-errors-on-unmatched {staged_files}
      fail_text: "Biome findings. Run: npx --no-install @biomejs/biome check --write <files>"
