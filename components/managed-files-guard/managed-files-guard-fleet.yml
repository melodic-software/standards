name: PR Check Managed Files

# SYNC-MANAGED FILE: DO NOT EDIT IN THE CONSUMING REPOSITORY.
# Source of truth: melodic-software/standards,
# components/managed-files-guard/managed-files-guard-fleet.yml (the
# `managed-files-guard-fleet-caller` component in
# distribution/sync-manifest.yml).
# Downstream edits are overwritten by the next sync PR; change the component
# upstream, or move the component to `locally-owned` in the manifest to
# customize.

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  pr-check-managed-files:
    name: PR Check Managed Files
    runs-on: melodic-ubuntu-24.04-x64
    timeout-minutes: 10
    steps:
      - name: Guard managed files
        uses: melodic-software/ci-workflows/.github/actions/check-managed-files@main
        with:
          standards-ref: main
