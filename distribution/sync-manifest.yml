      - architecture-decisions
      # claude-review-caller replaces medley's hand-written caller: its
      # missing `reopened` trigger and skip-actors divergence normalize away;
      # its `paths-ignore` tuning is an ACCEPTED LOSS (the component carries
      # no workflow-level path filtering), so medley's review volume rises
