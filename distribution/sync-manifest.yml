      # Slightly stale local copy at the canonical destination
      # (PSScriptAnalyzerSettings.psd1, 138 lines vs 141 — the one counterpart
      # SMALLER than canonical). Recorded 2026-08-16 (audit); nearest-parity
      # adoption candidate of the seven.
      - psscriptanalyzer
      # The canonical payload lands under .github/standards/pyright/ — no
      # overwrite of medley's root Python config is possible. Locally owned
      # because medley does not consume that destination. (The earlier
      # rationale here misattributed `target-version` — a ruff key — to
