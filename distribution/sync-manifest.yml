      # committed cloud-bootstrap.test.sh over it); converge by moving them
      # into a cloud-bootstrap.local.sh, then flip to managed.
      - cloud-bootstrap
      # The canonical payload lands under eng/dotnet-analysis/ — no collision
      # with medley's monorepo-tuned root .NET analyzer config is possible.
      # Locally owned because medley does not consume that destination:
      # adopting would land unused payloads beside its own tuned config.
      # Revisit if medley moves to the canonical destination layout.
      - dotnet-analysis
      # Diverged local copies of both payload files at the canonical
