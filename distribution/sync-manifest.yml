      # medley policy lives in a repo-owned comment-hygiene-local.sh that
      # sources this managed file and overrides chp::scan_text, so a managed
      # overwrite here breaks nothing. Managed = clobber containment, NOT
      # policy convergence — medley's enforcement policy stays its own in the
      # wrapper.
      - comment-hygiene-tools
      - lychee
      - node-runtime
      - path-detection-tools
      - pr-body-contract-rule
      - runner-policy
