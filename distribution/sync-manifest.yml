version: 2

components:
  architecture-decisions:
    files:
      docs/adr/README.md: docs/adr/README.md
      docs/adr/adr-template.md: docs/adr/adr-template.md
  biome:
    files:
      components/biome/biome.json: .github/standards/biome/biome.json
  claude-permissions:
    files:
      components/claude-permissions/claude-permissions.json: .chezmoidata/claude-permissions.json
  claude-review-caller:
    files:
      components/claude-lanes/claude-review.yml: .github/workflows/pr-review.yml
  claude-review-hosted-caller:
    files:
      components/claude-lanes-hosted/claude-review.yml: .github/workflows/pr-review-hosted.yml
  claude-security-review-caller:
    files:
      components/claude-lanes/claude-security-review.yml: .github/workflows/pr-review-security.yml
  claude-security-review-hosted-caller:
    files:
      components/claude-lanes-hosted/claude-security-review.yml: .github/workflows/pr-review-security-hosted.yml
  claude-settings-github-iac:
    files:
      components/claude-settings/targets/github-iac/settings.json: .claude/settings.json
  # Managed targets take the generic, data-driven script byte-exact; a repo
  # enriches through its own never-synced .claude/cloud-bootstrap.local.sh, or
  # goes `locally-owned` to customize the whole file. Deliberate exclusions:
  # - claude-code-plugins: `locally-owned` — its bootstrap carries
  #   directory-source dogfooding (same-version commit-drift repair) that must
  #   not fan out to github-source consumers.
  # - medley: `locally-owned` — its bootstrap and cloud-bootstrap.test.sh carry
  #   repo-specific toolchain steps; converge later by moving those into a
  #   cloud-bootstrap.local.sh, then flip to managed.
  cloud-bootstrap:
    files:
      components/cloud-bootstrap/cloud-bootstrap.sh: .claude/cloud-bootstrap.sh
  comment-hygiene-action:
    files:
      components/comment-hygiene/comment-hygiene-patterns.sh: .github/actions/check-comment-markers/comment-hygiene-patterns.sh
  comment-hygiene-tools:
    files:
      components/comment-hygiene/comment-hygiene-patterns.sh: tools/shared/comment-hygiene/comment-hygiene-patterns.sh
  commit-convention:
    files:
      components/commit-convention/commit-convention.yml: docs/conventions/source-control/commit-convention.yml
  # The reusable reads the Dependabot policy from this repository's `main`
  # (components/dependabot-policy/policy.json), never a synced copy, so neither
  # requires another component. Deliberate exclusions:
  # - ci-workflows: `locally-owned` — hosts the reusable itself at
  #   .github/workflows/pr-automerge-dependabot.yml and uses a queue workflow.
  # - medley: `locally-owned` — carries a repo-local second `automerge` job.
  dependabot-automerge-caller:
    files:
      components/dependabot-automerge/dependabot-automerge.yml: .github/workflows/pr-automerge-dependabot-hosted.yml
  dependabot-automerge-fleet-caller:
    files:
      components/dependabot-automerge/dependabot-automerge-fleet.yml: .github/workflows/pr-automerge-dependabot.yml
  dotnet-analysis:
    files:
      components/dotnet-analysis/Directory.Build.props: eng/dotnet-analysis/Directory.Build.props
      components/dotnet-analysis/dotnet.globalconfig: eng/dotnet-analysis/dotnet.globalconfig
  go-analysis:
    files:
      .golangci.yml: .golangci.yml
  issue-body-contract-plugins:
    files:
      components/issue-body-contract/contract.json: docs/contracts/issue-body/contract.json
  issue-forms:
    files:
      components/issue-body-contract/contract.json: .github/standards/issue-body-contract/contract.json
      components/issue-body-contract/forms/agent-ready.yml: .github/ISSUE_TEMPLATE/agent-ready.yml
      components/issue-body-contract/forms/bug-report.yml: .github/ISSUE_TEMPLATE/bug-report.yml
      components/issue-body-contract/forms/feature-request.yml: .github/ISSUE_TEMPLATE/feature-request.yml
      components/issue-body-contract/forms/task.yml: .github/ISSUE_TEMPLATE/task.yml
  lefthook-dotnet:
    requires:
      - dotnet-analysis
      - node-runtime
    files:
      components/lefthook-dotnet/dotnet-format-staged.mjs: .lefthook/dotnet-format-staged.mjs
      components/lefthook-dotnet/lefthook.yml: .lefthook/dotnet.yml
  lefthook-powershell:
    requires:
      - psscriptanalyzer
    files:
      components/lefthook-powershell/lefthook.yml: .lefthook/powershell.yml
      components/lefthook-powershell/psscriptanalyzer-staged.ps1: .lefthook/psscriptanalyzer-staged.ps1
      components/lefthook-powershell/psscriptanalyzer-target.ps1: .lefthook/psscriptanalyzer-target.ps1
  lefthook-python:
    requires:
      - ruff
    files:
      components/lefthook-python/lefthook.yml: .lefthook/python.yml
  lychee-online-claude-code-plugins:
    files:
      components/lychee-online/targets/claude-code-plugins.yml: .github/workflows/maintenance-check-links-online.yml
  # Deliberate exclusions:
  # - ci-workflows: `locally-owned` — it hosts the action and already runs
  #   the guard as a job of its own ci.yml (dogfood via a `./` action ref
  #   pinned to its own commit), so a second caller would double the check.
  managed-files-guard-caller:
    files:
      components/managed-files-guard/managed-files-guard.yml: .github/workflows/pr-check-managed-files-hosted.yml
  managed-files-guard-fleet-caller:
    files:
      components/managed-files-guard/managed-files-guard-fleet.yml: .github/workflows/pr-check-managed-files.yml
  markdownlint-home:
    files:
      components/markdownlint/home/.markdownlint-cli2.jsonc: dot_markdownlint-cli2.jsonc
  mcp-launcher:
    requires:
      - node-runtime
    files:
      components/mcp-launcher/dispatch.js: tools/mcp-launcher/dispatch.js
      components/mcp-launcher/launcher.js: tools/mcp-launcher/launcher.js
  node-runtime:
    files:
      .node-version: .node-version
  pages-publish:
    files:
      components/cloud-environment/pages-publish: dot_local/bin/executable_pages-publish
  path-detection-action:
    files:
      components/path-detection/machine-path-patterns.sh: .github/actions/check-machine-paths/machine-path-patterns.sh
  path-detection-guardrails:
    files:
      components/path-detection/machine-path-patterns.sh: plugins/guardrails/lib/path-detection/machine-path-patterns.sh
  path-detection-tools:
    files:
      components/path-detection/machine-path-patterns.sh: tools/shared/path-detection/machine-path-patterns.sh
  pr-template:
    files:
      components/pr-convention-policy/PULL_REQUEST_TEMPLATE.md: .github/PULL_REQUEST_TEMPLATE.md
  psscriptanalyzer:
    files:
      PSScriptAnalyzerSettings.psd1: PSScriptAnalyzerSettings.psd1
  repository-text:
    files:
      .editorconfig: .editorconfig
      .gitattributes: .gitattributes
  ruff:
    files:
      ruff.toml: ruff.toml
  tsconfig:
    files:
      components/tsconfig/tsconfig.json: .github/standards/tsconfig/tsconfig.json

targets:
  melodic-software/.github:
    managed:
      - claude-review-hosted-caller
      - claude-security-review-hosted-caller
      - cloud-bootstrap
      - commit-convention
      - dependabot-automerge-caller
      - issue-forms
      - managed-files-guard-caller
      - pr-template
      - repository-text
  melodic-software/azure-iac:
    managed:
      - managed-files-guard-fleet-caller
      - repository-text
  melodic-software/ci-runner:
    managed:
      - claude-review-hosted-caller
      - claude-security-review-hosted-caller
      - cloud-bootstrap
      - commit-convention
      - dependabot-automerge-caller
      - go-analysis
      - managed-files-guard-caller
      - repository-text
  melodic-software/ci-workflows:
    managed:
      - cloud-bootstrap
      - comment-hygiene-action
      - commit-convention
      - node-runtime
      - path-detection-action
      - psscriptanalyzer
      - repository-text
    # ci-workflows hosts the managed-files-guard action and already runs it
    # as a job of its own ci.yml, through a `./` action ref that resolves to
    # the commit under test. A synced caller pinned to an older commit would
    # run the guard twice per PR, once at each revision. Removal trigger:
    # ci-workflows retiring its in-repo job in favor of the synced caller.
    locally-owned:
      # ci-workflows hosts the pr-automerge-dependabot.yml reusable itself and
      # uses pr-automerge-dependabot-queue.yml for its merge queue.
      - dependabot-automerge-caller
      - managed-files-guard-caller
  melodic-software/claude-code-account-rotation:
    managed:
      - claude-review-hosted-caller
      - claude-security-review-hosted-caller
      - cloud-bootstrap
      - commit-convention
      - dependabot-automerge-caller
      - dotnet-analysis
      - lefthook-dotnet
      - managed-files-guard-caller
      - node-runtime
      - repository-text
  melodic-software/claude-code-plugins:
    managed:
      - issue-body-contract-plugins
      - lychee-online-claude-code-plugins
      - managed-files-guard-caller
      - node-runtime
      - path-detection-guardrails
      - repository-text
    # The hosted lane pair is locally owned here, so this repository's copies
    # can resolve their models through its own resolve-config action and pass
    # them as `model-args` (ci-workflows v0.45.0). No other target has that
    # action and a `models:` block in its pr-pipeline config, so the shared
    # callers keep the reusable defaults. Removal trigger: a second target
    # routing its review models that way, which moves the resolve step into
    # the shared component.
    #
    # `ruff`: the canonical policy reports 385 findings against that tree
    # against 166 under upstream's bare defaults, so adoption is a migration
    # rather than a config flip — most of the delta is `S`, `ERA`, `FIX`,
    # `PTH`, `ARG`, `RET`, and the `TID` relative-import ban meeting a codebase
    # never held to them. The repo owns a `ruff.toml` selecting `E4`, `E7`,
    # `E9`, and `F`, which is what stops upstream default churn from being a
    # repo-breaking event (ruff 0.16.0 moved the default set from 59 rules to
    # 413 and turned two of its contract suites red on an unmodified `main`).
    # Recorded here rather than left absent because absence is what produced an
    # implicit policy nobody chose. Removal trigger: that migration being
    # scheduled — moving this to `managed` restores the canonical payload.
    locally-owned:
      - claude-review-hosted-caller
      - claude-security-review-hosted-caller
      # Directory-source dogfooding: this repo's bootstrap carries same-version
      # commit-drift repair the canonical github-source script must not.
      - cloud-bootstrap
      # The repository carries the convention in
      # `docs/conventions/source-control.yaml` (ADR 0064), which the guardrails
      # resolver reads first (claude-code-plugins#10134), so the folder-form
      # file is deleted there and a sync would restore a second, unread copy.
      # Removal trigger: the guardrails resolver dropping its folder-form
      # fallback, after which the component can retire fleet-wide.
      - commit-convention
      - ruff
  melodic-software/claude-code-proxy:
    managed:
      - claude-review-caller
      - claude-security-review-caller
      - cloud-bootstrap
      - commit-convention
      - dependabot-automerge-fleet-caller
      - lefthook-powershell
      - lefthook-python
      - managed-files-guard-fleet-caller
      - node-runtime
      - psscriptanalyzer
      - repository-text
    # ruff stays repo-owned per the plan's Phase 4 line (ccproxy: ruff
    # locally-owned) — same shape as claude-code-plugins' entry above.
    locally-owned:
      - ruff
  melodic-software/dotfiles:
    managed:
      - claude-permissions
      - claude-review-caller
      - claude-security-review-caller
      - cloud-bootstrap
      - commit-convention
      - dependabot-automerge-fleet-caller
      - lefthook-powershell
      - lefthook-python
      - managed-files-guard-fleet-caller
      - markdownlint-home
      - node-runtime
      - pages-publish
      - psscriptanalyzer
      - repository-text
      - ruff
  melodic-software/github-iac:
    managed:
      - claude-review-caller
      - claude-security-review-caller
      - claude-settings-github-iac
      - cloud-bootstrap
      - commit-convention
      - dependabot-automerge-fleet-caller
      - dotnet-analysis
      - lefthook-dotnet
      - managed-files-guard-fleet-caller
      - node-runtime
      - repository-text
  melodic-software/knowledge-corpus:
    managed:
      - dependabot-automerge-fleet-caller
      - managed-files-guard-fleet-caller
  melodic-software/medley:
    managed:
      - architecture-decisions
      - biome
      - claude-review-caller
      - claude-security-review-caller
      - comment-hygiene-tools
      - commit-convention
      - managed-files-guard-fleet-caller
      - mcp-launcher
      - node-runtime
      - path-detection-tools
      - tsconfig
    locally-owned:
      # Repo-specific toolchain steps live inside the bootstrap itself (plus a
      # committed cloud-bootstrap.test.sh over it); converge by moving them
      # into a cloud-bootstrap.local.sh, then flip to managed.
      - cloud-bootstrap
      # Medley's pr-automerge-dependabot.yml carries an extra repo-local
      # `automerge` job beside the reusable call.
      - dependabot-automerge-fleet-caller
      # The canonical payload lands under eng/dotnet-analysis/ — no collision
      # with medley's monorepo-tuned root .NET analyzer config is possible.
      # Locally owned because medley does not consume that destination:
      # adopting would land unused payloads beside its own tuned config.
      # Revisit if medley moves to the canonical destination layout.
      - dotnet-analysis
      # Slightly stale local copy at the canonical destination
      # (PSScriptAnalyzerSettings.psd1, 138 lines vs 141 — the one counterpart
      # SMALLER than canonical). Recorded 2026-08-16 (audit); nearest-parity
      # adoption candidate among them.
      - psscriptanalyzer
      # Substantially diverged local copies of both payload files at the
      # canonical destinations (.editorconfig 204 lines vs 67, .gitattributes
      # 290 vs 61 — monorepo expansion). Recorded 2026-08-16 (audit); the
      # heaviest divergence of medley's counterpart files.
      - repository-text
      # The ONLY true root-file overwrite among medley's analyzer exclusions:
      # canonical ruff.toml at the repo root would clobber medley's tuned
      # `target-version`, `include`, and per-tree scope. Revisit when medley
      # adopts the dotfiles extend pattern.
      - ruff
  melodic-software/provisioning:
    managed:
      - claude-review-caller
      - claude-security-review-caller
      - cloud-bootstrap
      - commit-convention
      - dependabot-automerge-fleet-caller
      - lefthook-powershell
      - managed-files-guard-fleet-caller
      - node-runtime
      - psscriptanalyzer
      - repository-text
  melodic-software/songwriting:
    managed:
      - dependabot-automerge-fleet-caller
      - managed-files-guard-fleet-caller
