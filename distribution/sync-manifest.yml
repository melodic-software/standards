# Exact materializations owned by melodic-software/standards.
# Native package, GitHub Actions, and IaC adoption remain authoritative in
# their respective consumer manifests and are intentionally absent here.
version: 2

components:
  # actionlint queue-suppression config (ci-workflows claude-review-lanes plan,
  # Phase 3c0). Targets repos where the canonical file can own the config
  # outright — either no pre-existing actionlint config, or (ci-workflows) a
  # pre-existing copy whose only divergence from canonical was comment prose.
  # The source doubles as this repository's own live config. Deliberate
  # exclusions:
  # - medley: keeps its locally-owned config — repo-specific `self-hosted-runner`
  #   labels, including the deliberate `ci-runner-selection-failed` sentinel
  #   load-bearing in 12 workflows; a whole-file sync would overwrite them
  #   (12 label errors observed in the fleet probe).
  # - ci-runner: keeps its locally-owned config with repo-specific waivers a
  #   whole-file sync would clobber.
  # - github-iac: extends its own enumerated config in-repo; its
  #   GovernanceTopologyTests pin the config content.
  # - standards: manifest source, not a target — carries the canonical file.
  # - .github: no workflows needing it.
  actionlint:
    files:
      .github/actionlint.yaml: .github/actionlint.yaml
  architecture-decisions:
    files:
      docs/adr/README.md: docs/adr/README.md
      docs/adr/adr-template.md: docs/adr/adr-template.md
  claude-permissions:
    files:
      components/claude-permissions/claude-permissions.json: .chezmoidata/claude-permissions.json
  # Claude review-lane callers (ci-workflows claude-review-lanes plan, Phase
  # 3a): thin sync-managed callers for the ci-workflows reusable review lanes.
  # The live pin is recorded in the component caller files themselves and in
  # components/runner-policy/policy.json (approvedReusableWorkflowContracts) —
  # this comment deliberately names no version: pins move via the repin lane
  # and a version literal here goes stale. Managed — a recorded exception to
  # the workflow-caller exclusion in README.md — because hand-written lane
  # callers empirically drifted: medley's missing `reopened` trigger,
  # divergent skip-actors lists, and pin skew across targets.
  #
  # ACCEPTED LOSS, all targets: the code-review caller drops `synchronize`,
  # which every target's hand-written caller carries today. That is the plan's
  # deliberate cadence cut (review on open/ready/reopen) — not drift — and it
  # is the single largest behavior change this component makes. Reviewing a
  # newer head takes a fresh event, not a re-run; the component file states
  # why. The security lane KEEPS `synchronize`: its check certifies execution
  # against the latest head.
  #
  # Each component targets the repos that run that lane TODAY. Deliberate
  # exclusions:
  # - .github: exempt from lane components (near-zero PR traffic).
  # - standards: manifest source, not a target — keeps its repo-local caller.
  # - ci-runner: adopted as a review-lane target by the wave retarget
  #   (ci-workflows claude-review-lanes plan, ratified 2026-08-01), which
  #   reverses its earlier runner-infra exemption. It is ALREADY a target
  #   block below, so adding this component to its existing `managed:` list
  #   adds no repository to the installation's attested set and needs no App
  #   grant. Blocked on visibility as the nearer gate, NOT on the App grant:
  #   ci-runner is PUBLIC, and a selector-routed caller is rejected outright
  #   on a public repository (see the security-caller public/shared-shape
  #   blockers below). Removal trigger: the runner indirection moving inside
  #   the ci-workflows reusable, plus those remaining blockers. STILL LIVE
  #   when that fires, and not rebutted
  #   by the reversal: the original exemption reason, that ci-runner is runner
  #   infrastructure where a wedged lane job could block its own substrate.
  #   Visibility became the nearer blocker; it did not answer that concern, so
  #   adoption must clear it on the merits rather than inherit a pass.
  # - cursor-plugins: adopted by the same retarget and now a sync TARGET
  #   (Phase 4 fleet expansion, PR 428 — target block, App grant, and
  #   `TARGET_VISIBILITY` entry all shipped), but NOT yet a review-lane
  #   adopter: it is PUBLIC, and a selector-routed caller is rejected
  #   outright on a public repository, so the removal trigger above still
  #   gates adding it to this component's `managed:` lists.
  # - claude-code-proxy: adopted by the same retarget and now a sync TARGET
  #   (same Phase 4 expansion — target block, App grant, and
  #   `TARGET_VISIBILITY` entry shipped), admissible on visibility (private),
  #   but not yet a review-lane adopter: it runs no claude lane today, so
  #   adding it to this component's `managed:` lists waits on deliberate lane
  #   adoption, not on any grant.
  # - knowledge-corpus, songwriting: their PLANNED-target record is retired by
  #   the same retarget. Neither ever held a target block, so nothing left
  #   `targets:`; what went is that record and their `TARGET_VISIBILITY`
  #   entries. This bullet answers the review-LANE question only — whether
  #   either joins the sync-target ROSTER is a separate question, answered at
  #   the Phase 4 fleet-expansion comment near `targets:` (knowledge-corpus
  #   deferred on a structural LFS blocker; songwriting dropped). On the lane:
  #   neither is a code repo, so a code-review lane has near-zero signal.
  #   songwriting (lyric files) is dropped outright. knowledge-corpus is
  #   DEFERRED rather than dropped: its scraped third-party HTML is content
  #   an agent later reads, which is a prompt-injection surface rather than a
  #   code-quality one. Removal trigger: prompt-injection hardening for a
  #   review lane over untrusted third-party content — and then for a security
  #   or content-scanning lane, not for claude-review as written.
  #
  # PUBLIC-SAFE SHAPE, CONSIDERED AND REJECTED for the two public adoptions:
  # a hand-written hosted-only caller passing `runner: ubuntu-24.04` directly,
  # with no caller-side selector — the shape claude-code-plugins already owns
  # `locally-owned`. runner-policy admits it on a public repository, so the
  # bar is a property of the SELECTOR-ROUTED shape, not of public visibility
  # as such. Rejected because it forks the reviewed caller into a second
  # per-visibility variant, which this repository deliberately declined
  # pending the reusable-side indirection. It would also require revisiting
  # `runner-policy.test.mjs`: its "every managed target of a claude lane
  # caller admits that caller" test rejects a public managed target for EVERY
  # component sourced from `components/claude-lanes/`, selector-using or not,
  # so a hosted-only component in that directory still fails the build.
  #
  # The security caller reads the repo-owned `.github/claude-security-paths`
  # pattern file (absent = fail-open: every PR reviewed). That file is
  # deliberately NOT sync-managed, and the manifest has no seed-once
  # mechanism, so a new adopter commits its starter list via a repo-local PR
  # at adoption time.
  #
  # `claude-security-review-caller` is managed for private adopters (see
  # `provisioning` below). Public/shared-shape unpark is still blocked: a
  # caller that resolves its runner through the governed selector is rejected
  # outright on a public repository — runner-policy admits the selector only
  # for a private self-hosted consumer, consulting neither `exceptions` nor
  # `localRoutingGrants`. Moving the runner indirection inside the
  # ci-workflows reusable is necessary but NOT sufficient for one caller
  # shape across both visibilities (#377). Remaining blockers:
  # (1) a new cross-repo reusable routing kind in runner-policy (schema,
  # analyzer, tests, schemaVersion, contract entries, fleet re-pin) —
  # `internal-routing` today is repository-local only; the caller must still
  # pass `secrets: observer-private-key`;
  # (2) narrow `runner-policy.test.mjs`'s blanket
  # "every managed target of a claude lane caller admits that caller" rule,
  # which rejects EVERY `components/claude-lanes/` public managed target
  # whether or not the caller references select-runner;
  # (3) claude-code-plugins' repo-owned `security-review-evidence` job and
  # ADR-required local `skip-actors` cannot be sync-managed as written —
  # absorb the evidence guard into the reusable, or keep that one caller
  # `locally-owned`. The claude-code-plugins `locally-owned` note below
  # records this same three-part trigger.
  claude-review-caller:
    files:
      components/claude-lanes/claude-review.yml: .github/workflows/claude-review.yml
  claude-security-review-caller:
    files:
      components/claude-lanes/claude-security-review.yml: .github/workflows/claude-security-review.yml
  # Per-target exact settings.json (issue 404). Not a transform: each
  # consumer has its own source file. Shared marketplace + bootstrap hook
  # are asserted against components/claude-settings/base/settings.json.
  # First consumer: github-iac. Add targets/<repo>/settings.json + a
  # dest-mapping component to extend the fleet.
  claude-settings-github-iac:
    files:
      components/claude-settings/targets/github-iac/settings.json: .claude/settings.json
  # Canonical per-repo cloud bootstrap (components/cloud-bootstrap/README.md).
  # Managed targets take the generic, data-driven script byte-exact; a repo
  # enriches through its own never-synced .claude/cloud-bootstrap.local.sh, or
  # goes `locally-owned` to customize the whole file. Deliberate exclusions:
  # - standards: manifest source, not a target — its copy is held byte-identical
  #   to the component by cloud-bootstrap.test.sh instead.
  # - claude-code-plugins: `locally-owned` — its bootstrap carries
  #   directory-source dogfooding (same-version commit-drift repair) that must
  #   not fan out to github-source consumers.
  # - medley: `locally-owned` — its bootstrap and cloud-bootstrap.test.sh carry
  #   repo-specific toolchain steps; converge later by moving those into a
  #   cloud-bootstrap.local.sh, then flip to managed.
  cloud-bootstrap:
    files:
      components/cloud-bootstrap/cloud-bootstrap.sh: .claude/cloud-bootstrap.sh
  comment-hygiene-action:
    files:
      components/comment-hygiene/comment-hygiene-patterns.sh: .github/actions/comment-hygiene/comment-hygiene-patterns.sh
  comment-hygiene-tools:
    files:
      components/comment-hygiene/comment-hygiene-patterns.sh: tools/shared/comment-hygiene/comment-hygiene-patterns.sh
  dotnet-analysis:
    files:
      components/dotnet-analysis/Directory.Build.props: eng/dotnet-analysis/Directory.Build.props
      components/dotnet-analysis/dotnet.globalconfig: eng/dotnet-analysis/dotnet.globalconfig
  editorconfig-checker:
    requires:
      - repository-text
    files:
      .editorconfig-checker.json: .editorconfig-checker.json
  gitleaks:
    files:
      .gitleaks.toml: .gitleaks.toml
  go-analysis:
    files:
      .golangci.yml: .golangci.yml
  lefthook-base:
    requires:
      - editorconfig-checker
      - gitleaks
      - markdownlint
      - node-runtime
      - repository-text
      - typos
    files:
      components/lefthook-base/lefthook.yml: .lefthook/base.yml
  lefthook-dotnet:
    requires:
      - dotnet-analysis
      - lefthook-base
      - node-runtime
    files:
      components/lefthook-dotnet/dotnet-format-staged.mjs: .lefthook/dotnet-format-staged.mjs
      components/lefthook-dotnet/lefthook.yml: .lefthook/dotnet.yml
  lefthook-powershell:
    requires:
      - lefthook-base
      - psscriptanalyzer
    files:
      components/lefthook-powershell/lefthook.yml: .lefthook/powershell.yml
      components/lefthook-powershell/psscriptanalyzer-staged.ps1: .lefthook/psscriptanalyzer-staged.ps1
      components/lefthook-powershell/psscriptanalyzer-target.ps1: .lefthook/psscriptanalyzer-target.ps1
  lefthook-python:
    requires:
      - lefthook-base
      - ruff
    files:
      components/lefthook-python/lefthook.yml: .lefthook/python.yml
  lefthook-shellcheck:
    requires:
      - lefthook-base
      - shellcheck
    files:
      components/lefthook-shellcheck/lefthook.yml: .lefthook/shellcheck.yml
  lychee:
    files:
      lychee.toml: lychee.toml
  # Advisory managed-files-guard caller (standards#496, ADR-0007): a thin
  # hosted-only workflow calling the ci-workflows `managed-files-guard`
  # composite action, which fails a consumer PR that hand-edits one of that
  # repository's managed destinations. The second recorded exception to the
  # workflow-caller exclusion in README.md, for the same reason as the first:
  # the guard is only a fleet signal if every target carries the same caller
  # at the same pin, and the sync is the one mechanism that holds that.
  #
  # FIRST HOP — hosted-only-eligible targets only. The caller's `runs-on` is
  # the approved hosted label directly, which runner-policy admits on a
  # public repository and on a private one not enrolled for local routing.
  # Deliberate exclusions this hop, with their removal trigger:
  # - dotfiles, github-iac, medley, provisioning: private targets enrolled
  #   for selector routing (each manages `runner-policy` with a
  #   selector-routed lane caller), where a fixed hosted read-only job fails
  #   the runner-policy gate. They take a selector-routed sibling component
  #   in the second hop; trigger: that sibling landing.
  # - ci-workflows: `locally-owned` — it hosts the action and already runs
  #   the guard as a job of its own ci.yml (dogfood via a `./` action ref
  #   pinned to its own commit), so a second caller would double the check.
  # - standards: manifest source, not a target.
  # Not in `ci-status` anywhere during soak; promotion is per-target and
  # recorded in components/managed-files-guard/README.md.
  managed-files-guard-caller:
    files:
      components/managed-files-guard/managed-files-guard.yml: .github/workflows/managed-files-guard.yml
  markdownlint:
    files:
      .markdownlint-cli2.jsonc: .markdownlint-cli2.jsonc
  markdownlint-home:
    files:
      components/markdownlint/home/.markdownlint-cli2.jsonc: dot_markdownlint-cli2.jsonc
  node-runtime:
    files:
      .node-version: .node-version
  path-detection-action:
    files:
      components/path-detection/machine-path-patterns.sh: .github/actions/machine-specific-paths/machine-path-patterns.sh
  path-detection-guardrails:
    files:
      components/path-detection/machine-path-patterns.sh: plugins/guardrails/lib/path-detection/machine-path-patterns.sh
  path-detection-tools:
    files:
      components/path-detection/machine-path-patterns.sh: tools/shared/path-detection/machine-path-patterns.sh
  # Always-loaded PR-body contract rule for every pr-issue-linkage gate caller
  # (standards ADR-0008): the one repo-tracked signal that reaches sessions
  # with no plugins installed. The source doubles as this repository's own
  # live rule (standards is manifest source, not a target); the lockstep
  # drift check (components/pr-convention-policy/lockstep-drift.mjs) holds it
  # in step with policy.json.
  pr-body-contract-rule:
    files:
      .claude/rules/pr-body-contract.md: .claude/rules/pr-body-contract.md
  psscriptanalyzer:
    files:
      PSScriptAnalyzerSettings.psd1: PSScriptAnalyzerSettings.psd1
  pyright:
    files:
      components/pyright/pyrightconfig.json: .github/standards/pyright/pyrightconfig.json
  repository-text:
    files:
      .editorconfig: .editorconfig
      .gitattributes: .gitattributes
  review-instructions:
    files:
      REVIEW.md: REVIEW.md
  ruff:
    files:
      ruff.toml: ruff.toml
  runner-policy:
    requires:
      - node-runtime
    files:
      components/runner-policy/package-lock.json: .github/standards/runner-policy/package-lock.json
      components/runner-policy/package.json: .github/standards/runner-policy/package.json
      components/runner-policy/policy.json: .github/standards/runner-policy/policy.json
      components/runner-policy/policy.schema.json: .github/standards/runner-policy/policy.schema.json
      components/runner-policy/repository-policy.schema.json: .github/standards/runner-policy/repository-policy.schema.json
      components/runner-policy/runner-policy.mjs: .github/standards/runner-policy/runner-policy.mjs
  shellcheck:
    files:
      .shellcheckrc: .shellcheckrc
  typos:
    files:
      _typos.toml: _typos.toml

# Automerge is restored (standards-sync-audit remediation,
# docs/topics/standards-sync-audit/): the watchdog's tracking-issue
# create/update/close/fail lifecycle is PROVEN via dispatched test-mode runs
# (proof artifact in that plan, 2026-08-17), and the melodic-software/.github
# canary was observed end-to-end on 2026-08-23 — PR 62 armed on open and
# self-merged 31 seconds later with all four required contexts green. An
# absent automerge key is the armed default, and the fleet is armed.
#
# No per-target opt-out remains as of 2026-09-04. The last three
# (agent-plugins, cursor-plugins, claude-code-proxy) were disarmed only because
# their default branches sat outside the org ci-gate ruleset; github-iac#367
# extended the ruleset to them once each carried the four required contexts,
# and their keys were dropped with the dated evidence recorded at each target.
# The key stays available fleet-wide as a per-target opt-out for any future
# staged rollout.
targets:
  melodic-software/.github:
    managed:
      - cloud-bootstrap
      - editorconfig-checker
      - gitleaks
      - lychee
      - managed-files-guard-caller
      - markdownlint
      - pr-body-contract-rule
      - repository-text
      - typos
  # Adopted 2026-09-05 at repository creation (github-iac governs it; the
  # Pulumi entry and this target land in the same window). A public .NET tool
  # repo, so the set is github-iac's minus what a public hosted-only target
  # cannot carry: `claude-settings-github-iac` (per-target settings file),
  # `runner-policy` (private selector-routed consumers only), and both
  # `components/claude-lanes/` callers, which name the private fleet's runner
  # label and are refused on a public repository (see the
  # `claude-security-review-caller` note above). Hosted lane callers arrive by
  # repo-local PR, the claude-code-plugins route. Plus the hosted-only
  # `managed-files-guard-caller`, which every public target carries.
  # `automerge: false` because the repository sits outside the org ci-gate
  # ruleset until github-iac flips its requires-ci, so an armed sync PR would
  # merge ungated; removal trigger: that flip, in the change that lands the
  # four ci-gate callers.
  melodic-software/account-rotation:
    automerge: false
    managed:
      - cloud-bootstrap
      - dotnet-analysis
      - editorconfig-checker
      - gitleaks
      - lefthook-base
      - lefthook-dotnet
      - lychee
      - managed-files-guard-caller
      - markdownlint
      - node-runtime
      - pr-body-contract-rule
      - repository-text
      - review-instructions
      - shellcheck
      - typos
  # Adopted 2026-08-19 by operator decision, POSTDATING the standards-sync-audit
  # plan's Phase 4 roster (repo created 2026-08-17, after that plan locked —
  # no considered exclusion is overridden). Same shape as the two sibling
  # marketplace targets: hygiene set + cloud-bootstrap. The adoption sync
  # (PR 1, merged 2026-08-19) created those payloads; the repo is converged now
  # and syncs incrementally like any other target.
  melodic-software/agent-plugins:
    managed:
      - cloud-bootstrap
      - editorconfig-checker
      - gitleaks
      - lychee
      - managed-files-guard-caller
      - markdownlint
      - repository-text
      - typos
    # Armed as of 2026-09-04: agent-plugins#11 landed ci.yml plus the three
    # metadata callers, probe PR agent-plugins#12 showed pr-title,
    # do-not-merge, pr-issue-linkage and ci-status all SUCCESS, and
    # github-iac#367 extended the org ci-gate ruleset to this repository.
  melodic-software/ci-runner:
    managed:
      - cloud-bootstrap
      - editorconfig-checker
      - gitleaks
      - go-analysis
      - lychee
      - managed-files-guard-caller
      - markdownlint
      - pr-body-contract-rule
      - repository-text
      - shellcheck
      - typos
    locally-owned:
      - actionlint
  melodic-software/ci-workflows:
    managed:
      # Flipped to managed after byte-parity held: the pre-existing local copy
      # (the file this component's content was derived from) differed from
      # canonical only in comment prose.
      - actionlint
      - cloud-bootstrap
      - comment-hygiene-action
      - editorconfig-checker
      - gitleaks
      - lychee
      - markdownlint
      - node-runtime
      - path-detection-action
      - pr-body-contract-rule
      - psscriptanalyzer
      - repository-text
      - review-instructions
      - shellcheck
      - typos
    # ci-workflows hosts the managed-files-guard action and already runs it
    # as a job of its own ci.yml, through a `./` action ref that resolves to
    # the commit under test. A synced caller pinned to an older commit would
    # run the guard twice per PR, once at each revision. Removal trigger:
    # ci-workflows retiring its in-repo job in favor of the synced caller.
    locally-owned:
      - managed-files-guard-caller
  melodic-software/claude-code-plugins:
    managed:
      - actionlint
      - editorconfig-checker
      - gitleaks
      - lychee
      - managed-files-guard-caller
      - markdownlint
      - node-runtime
      - path-detection-guardrails
      - pr-body-contract-rule
      - pyright
      - repository-text
      - review-instructions
      - runner-policy
      - shellcheck
      - typos
    # The lane callers resolve the runner through the governed select-runner
    # indirection, which runner-policy forbids a PUBLIC repository from
    # referencing at all (`routingEnabled` is private-and-self-hosted only, and
    # the ban consults neither `exceptions` nor `localRoutingGrants`). This is
    # the org's one public caller target, so it owns hosted-only callers that
    # pass `runner: ubuntu-24.04` directly. Removal trigger (necessary but not
    # sufficient — see the `claude-security-review-caller` public/shared-shape
    # blockers above / #377): (1) runner indirection moves inside the
    # ci-workflows reusable, (2) runner-policy gains a cross-repo routing kind
    # and the blanket public-target claude-lanes test is narrowed, and
    # (3) this repo's `security-review-evidence` job plus ADR-required local
    # `skip-actors` are absorbed into the reusable (or this caller stays
    # `locally-owned`). Only then does one managed component serve both
    # visibilities without deleting the evidence guard.
    #
    # `ruff`: the canonical policy reports 385 findings against that tree
    # against 166 under upstream's bare defaults, so adoption is a migration
    # rather than a config flip — most of the delta is `S`, `ERA`, `FIX`,
    # `PTH`, `ARG`, `RET`, and the `TID` relative-import ban meeting a codebase
    # never held to them. The repo owns a `ruff.toml` selecting `E4`, `E7`,
    # `E9`, and `F`, which is what stops upstream default churn from being a
    # repo-breaking event (ruff 0.16.0 moved the default set from 59 rules to
    # 413 and turned two of its contract suites red on an unmodified `main`).
    # Recorded here rather than left absent because absence is what produced an
    # implicit policy nobody chose. Removal trigger: that migration being
    # scheduled — moving this to `managed` restores the canonical payload.
    locally-owned:
      - claude-review-caller
      - claude-security-review-caller
      # Directory-source dogfooding: this repo's bootstrap carries same-version
      # commit-drift repair the canonical github-source script must not.
      - cloud-bootstrap
      - ruff
  # Phase 4 fleet expansion (standards-sync-audit plan, Brief line "Phase 4"):
  # claude-code-proxy, codex-plugins, and cursor-plugins enter with the
  # hygiene set plus cloud-bootstrap (each held an unmanaged, drifting copy of
  # .claude/cloud-bootstrap.sh — 2026-08-16 fleet audit). The sync App's
  # selected-repo grant covers them as of 2026-08-19 (grant-first per the
  # plan's exact-set attestation constraint). Deliberate NON-adoptions, per
  # the same locked plan:
  # - knowledge-corpus: deferred from the sync-target ROSTER — structural LFS
  #   blocker recorded; no extend mechanism exists. The separate review-LANE
  #   question is answered at the claude-review caller comment above.
  # - songwriting: dropped outright (github-iac ADR-0006); its two drifted
  #   files were hand-fixed once (plan Phase 0.6), not adopted.
  # - claude-lane-sandbox: a disposable lane-testing sandbox, not a
  #   convergence target — sync PRs there are churn against throwaway state.
  #   Rationale mirrored here per the plan so the manifest, not only the
  #   plan file, records why it is absent.
  # Beyond the Phase 4 hygiene set, claude-code-proxy manages the lefthook
  # lanes, psscriptanalyzer, and pyright per its own plan's Phase 1 adoption
  # (docs/topics/claude-code-logging-proxy/PLAN.md, approved 2026-07-26):
  # lefthook-base + lefthook-powershell + lefthook-python with their closure
  # (node-runtime, psscriptanalyzer). ruff stays locally-owned (below) and
  # satisfies lefthook-python's requirement as a repo-owned implementation.
  melodic-software/claude-code-proxy:
    managed:
      - cloud-bootstrap
      - editorconfig-checker
      - gitleaks
      - lefthook-base
      - lefthook-powershell
      - lefthook-python
      - lychee
      - managed-files-guard-caller
      - markdownlint
      - node-runtime
      - psscriptanalyzer
      - pyright
      - repository-text
      - typos
    # ruff stays repo-owned per the plan's Phase 4 line (ccproxy: ruff
    # locally-owned) — same shape as claude-code-plugins' entry above.
    locally-owned:
      - ruff
