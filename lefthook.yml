min_version: "2.0.5"
assert_lefthook_installed: true
# The default matcher's `**/*.ext` misses repo-root files; doublestar matches them:
# https://lefthook.dev/configuration/glob_matcher/
glob_matcher: doublestar

remotes:
  - git_url: https://github.com/melodic-software/claude-code-plugins
    ref: main
    refetch_frequency: 24h
    configs:
      - lefthook-remote.yml
  - git_url: https://github.com/melodic-software/standards
    ref: main
    refetch_frequency: 24h
    configs:
      - components/lefthook-base/lefthook-remote.yml

pre-commit:
  parallel: true
  exclude:
    - "components/*/fixtures/bad/**"
  commands:
    psscriptanalyzer:
      glob: "**/*.{ps1,psm1,psd1}"
      run: >-
        pwsh -NoProfile -NonInteractive -File
        components/lefthook-powershell/psscriptanalyzer-staged.ps1 {staged_files}
      fail_text: "PSScriptAnalyzer findings. Fix them or justify the exception."
    dotnet-format:
      glob: "**/*.cs"
      run: node components/lefthook-dotnet/dotnet-format-staged.mjs {staged_files}
      fail_text: "Whitespace/layout drift in the .NET analysis fixture."
