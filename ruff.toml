line-length = 88

[lint]
# PLW1514 is a preview rule; explicit-preview-rules keeps other preview rules off:
# https://docs.astral.sh/ruff/rules/unspecified-encoding/
preview = true
explicit-preview-rules = true

select = [
  "F",        # Pyflakes — correctness
  "E", "W",   # pycodestyle — style errors/warnings
  "I",        # isort — import ordering
  "N",        # pep8-naming
  "UP",       # pyupgrade — modernize syntax (bounded by requires-python)
  "B",        # flake8-bugbear — likely bugs
  "C4",       # flake8-comprehensions
  "SIM",      # flake8-simplify
  "PTH",      # flake8-use-pathlib
  "S",        # flake8-bandit — security
  "ASYNC",    # flake8-async — blocking calls in async code
  "DTZ",      # flake8-datetimez — naive datetimes (owns the datetime checks)
  "ARG",      # flake8-unused-arguments
  "RET",      # flake8-return
  "TID",      # flake8-tidy-imports — relative-import + banned-api rules below
  "PIE",      # flake8-pie — misc anti-patterns
  "PERF",     # Perflint — performance anti-patterns
  "LOG",      # flake8-logging
  "G",        # flake8-logging-format
  "PLE",      # Pylint errors — high-value, low-noise
  "PLW1514",  # Pylint: unspecified-encoding on open() (preview)
  "FIX",      # flake8-fixme — surface TODO/FIXME/HACK markers
  "ERA",      # eradicate — commented-out code
  "RUF",      # Ruff-specific rules
]

ignore = [
  # The formatter may exceed line-length, so E501 would be unfixable noise:
  # https://docs.astral.sh/ruff/formatter/#conflicting-lint-rules
  "E501",
]

[lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/**" = ["S101", "S105", "S106", "S107"]
"**/conftest.py" = ["S101"]

[lint.flake8-tidy-imports]
ban-relative-imports = "all"

[lint.flake8-tidy-imports.banned-api]
"os.path".msg = "Use pathlib.Path."
"glob.glob".msg = "Use pathlib.Path.glob."

[format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true
docstring-code-line-length = "dynamic"
